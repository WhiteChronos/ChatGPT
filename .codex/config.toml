[features]
multi_agent = true

[plugins."github-arena@whitechronos-repo"]
enabled = true

[plugins."github-arena@whitechronos-repo".mcp_servers.github_arena]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = ["arena_plan", "arena_cards", "arena_rubric", "arena_review_checklist"]

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."superpowers-controller@whitechronos-repo"]
enabled = true

[plugins."matt-pocock-controller@whitechronos-repo"]
enabled = true

[plugins."ecc@whitechronos-repo"]
enabled = true

[plugins."ecc-controller@whitechronos-repo"]
enabled = true

[plugins."subagent-broker@whitechronos-repo"]
enabled = true

[plugins."subagent-broker@whitechronos-repo".mcp_servers.subagent_broker]
enabled = true
default_tools_approval_mode = "approve"
enabled_tools = [
  "subagent_spawn",
  "subagent_status",
  "subagent_wait",
  "subagent_result",
  "subagent_followup",
  "subagent_list",
  "subagent_cancel",
  "subagent_cleanup"
]


[plugins."awesome-llm-apps-controller@whitechronos-repo"]
enabled = true

[plugins."whitechronos-control-plane@whitechronos-repo"]
enabled = true

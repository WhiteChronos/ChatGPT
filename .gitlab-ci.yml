spec:
  inputs:
    mirror_transport:
      options:
        - neutral_worker
    mirror_source_repository:
      regex: '\AWhiteChronos/ChatGPT\z'
    mirror_target_project:
      regex: '\Achronoswhite-group/ChronosWhite-project\z'
    mirror_ref:
      regex: '\A(main|(spec|plan|feat|fix|release)/[^[:space:]]+)\z'
    mirror_pipeline_ref:
      regex: '\A(main|(spec|plan|feat|fix|release)/[^[:space:]]+|whitechronos-refresh/[0-9a-f]{64})\z'
    mirror_source_sha:
      regex: '\A[0-9a-fA-F]{40}\z'
    mirror_target_sha:
      regex: '\A[0-9a-fA-F]{40}\z'
    mirror_timestamp:
      regex: '\A[0-9]{4}-[0-9]{2}-[0-9]{2}T[^[:space:]]+\z'
    mirror_receipt_sha256:
      regex: '\A[0-9a-fA-F]{64}\z'
    mirror_worker_revision:
      regex: '\A[0-9a-fA-F]{40}\z'
---
stages:
  - parity
  - validate
  - evidence
  - cleanup

default:
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  WHITECHRONOS_MIRROR_TRANSPORT: "$[[ inputs.mirror_transport ]]"
  WHITECHRONOS_MIRROR_SOURCE_REPOSITORY: "$[[ inputs.mirror_source_repository ]]"
  WHITECHRONOS_MIRROR_TARGET_PROJECT: "$[[ inputs.mirror_target_project ]]"
  WHITECHRONOS_MIRROR_REF: "$[[ inputs.mirror_ref ]]"
  WHITECHRONOS_MIRROR_PIPELINE_REF: "$[[ inputs.mirror_pipeline_ref ]]"
  WHITECHRONOS_MIRROR_SOURCE_SHA: "$[[ inputs.mirror_source_sha ]]"
  WHITECHRONOS_MIRROR_TARGET_SHA: "$[[ inputs.mirror_target_sha ]]"
  WHITECHRONOS_MIRROR_TIMESTAMP: "$[[ inputs.mirror_timestamp ]]"
  WHITECHRONOS_MIRROR_RECEIPT_SHA256: "$[[ inputs.mirror_receipt_sha256 ]]"
  WHITECHRONOS_MIRROR_WORKER_REVISION: "$[[ inputs.mirror_worker_revision ]]"

mirror-parity:
  stage: parity
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip check
  script:
    - |
      python - <<'PY'
      import json
      import os
      import re
      import subprocess
      from datetime import datetime, timezone
      from pathlib import Path
      from urllib.parse import urlsplit
      from urllib.request import Request, urlopen

      from pipeline.git_mirror_observation import observe_remote_ref

      policy = json.loads(Path("governance/GITLAB_CONTINGENCY_CI_POLICY.json").read_text(encoding="utf-8"))
      expected_project_id = int(policy["gitlab_project_id"])
      expected_project_path = policy["gitlab_project_path"]
      if not expected_project_path:
          raise SystemExit("GitLab project path is not provisioned")

      safe_env = {
          key: value
          for key in ("PATH", "HOME", "LANG", "LC_ALL", "SYSTEMROOT", "WINDIR", "TMP", "TEMP", "TMPDIR")
          if (value := os.environ.get(key))
      }
      safe_env["GIT_CONFIG_NOSYSTEM"] = "1"
      safe_env["GIT_CONFIG_GLOBAL"] = os.devnull
      safe_env["GIT_TERMINAL_PROMPT"] = "0"

      # trusted checkout identity source: git remote get-url origin
      def git(*args):
          return subprocess.run(
              ["git", *args],
              check=True,
              text=True,
              capture_output=True,
              env=safe_env,
          ).stdout.strip()

      head_sha = git("rev-parse", "HEAD").lower()
      origin_url = git("remote", "get-url", "origin")
      if origin_url.startswith("git@gitlab.com:"):
          observed_project_path = origin_url.split(":", 1)[1]
      else:
          parsed = urlsplit(origin_url)
          if parsed.scheme != "https" or (parsed.hostname or "").lower() != "gitlab.com":
              raise SystemExit("checkout origin is not GitLab.com")
          observed_project_path = parsed.path.lstrip("/")
      if observed_project_path.endswith(".git"):
          observed_project_path = observed_project_path[:-4]
      if observed_project_path != expected_project_path:
          raise SystemExit("checkout project path does not match provisioned mirror policy")

      token = os.environ.get("CI_JOB_TOKEN")
      if not token:
          raise SystemExit("CI_JOB_TOKEN is required for trusted GitLab job identity")
      request = Request(
          "https://gitlab.com/api/v4/job",
          headers={"JOB-TOKEN": token, "Accept": "application/json"},
      )
      with urlopen(request, timeout=20) as response:
          job = json.load(response)

      pipeline = job.get("pipeline") or {}
      commit = job.get("commit") or {}
      if int(pipeline.get("project_id", 0)) != expected_project_id:
          raise SystemExit("job-token project ID does not match provisioned mirror policy")
      if str(pipeline.get("sha", "")).lower() != head_sha or str(commit.get("id", "")).lower() != head_sha:
          raise SystemExit("job-token commit identity does not match checkout HEAD")
      trusted_ref = str(job.get("ref", "")).strip()
      if not trusted_ref:
          raise SystemExit("job-token response did not provide a ref")
      job_source = str(pipeline.get("source") or job.get("source", "")).strip()
      pipeline_id = str(pipeline.get("id", "")).strip()
      if not pipeline_id:
          raise SystemExit("job-token response did not provide a pipeline ID")
      if job_source != "push":
          raise SystemExit("eligible mirror evidence requires a trusted Git push")
      if bool(job.get("tag")):
          raise SystemExit("tag-triggered jobs cannot establish branch receipt evidence")

      receipt = {
          "schema_version": 1,
          "transport": os.environ.get("WHITECHRONOS_MIRROR_TRANSPORT", ""),
          "source_repository": os.environ.get("WHITECHRONOS_MIRROR_SOURCE_REPOSITORY", ""),
          "target_project_path": os.environ.get("WHITECHRONOS_MIRROR_TARGET_PROJECT", ""),
          "ref": os.environ.get("WHITECHRONOS_MIRROR_REF", ""),
          "pipeline_ref": os.environ.get("WHITECHRONOS_MIRROR_PIPELINE_REF", ""),
          "source_sha": os.environ.get("WHITECHRONOS_MIRROR_SOURCE_SHA", "").lower(),
          "target_sha": os.environ.get("WHITECHRONOS_MIRROR_TARGET_SHA", "").lower(),
          "timestamp": os.environ.get("WHITECHRONOS_MIRROR_TIMESTAMP", ""),
          "worker_revision": os.environ.get("WHITECHRONOS_MIRROR_WORKER_REVISION", "").lower(),
      }
      receipt_digest = os.environ.get("WHITECHRONOS_MIRROR_RECEIPT_SHA256", "").lower()
      if not receipt_digest:
          raise SystemExit("neutral worker mirror receipt digest is required")
      import hashlib
      import hmac
      expected_receipt_digest = hashlib.sha256(
          json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode("utf-8")
      ).hexdigest()
      if not hmac.compare_digest(receipt_digest, expected_receipt_digest):
          raise SystemExit("mirror receipt digest mismatch")
      if receipt["transport"] != "neutral_worker":
          raise SystemExit("mirror receipt transport mismatch")
      if receipt["source_repository"] != policy["source_repository"]:
          raise SystemExit("mirror receipt source repository mismatch")
      if receipt["target_project_path"] != expected_project_path:
          raise SystemExit("mirror receipt target project mismatch")
      if receipt["pipeline_ref"] != trusted_ref:
          raise SystemExit("mirror receipt pipeline ref mismatch")
      if receipt["pipeline_ref"] != receipt["ref"]:
          refresh_raw = "\0".join(
              str(receipt[key]) for key in ("ref", "source_sha", "timestamp")
          ).encode("utf-8")
          expected_refresh = "whitechronos-refresh/" + hashlib.sha256(refresh_raw).hexdigest()
          if receipt["pipeline_ref"] != expected_refresh:
              raise SystemExit("reserved same-SHA refresh branch mismatch")
      if receipt["source_sha"] != head_sha or receipt["target_sha"] != head_sha:
          raise SystemExit("mirror receipt SHA mismatch")
      if not re.fullmatch(r"[0-9a-fA-F]{40}", receipt["worker_revision"]):
          raise SystemExit("mirror receipt worker revision mismatch")
      try:
          datetime.fromisoformat(str(receipt["timestamp"]).replace("Z", "+00:00"))
      except ValueError as exc:
          raise SystemExit("mirror receipt timestamp is invalid") from exc

      observation = observe_remote_ref(
          "https://github.com/WhiteChronos/ChatGPT.git",
          receipt["ref"],
      )
      full_ref = f"refs/heads/{receipt['ref']}"
      gitlab_probe = subprocess.run(
          ["git", "ls-remote", "--exit-code", "origin", full_ref],
          check=False,
          text=True,
          capture_output=True,
          env=safe_env,
      )
      gitlab_remote_sha = None
      gitlab_available = False
      if gitlab_probe.returncode == 0:
          lines = [line.strip() for line in gitlab_probe.stdout.splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit("GitLab remote observation returned malformed output")
          parts = lines[0].split()
          if (
              len(parts) != 2
              or parts[1] != full_ref
              or not re.fullmatch(r"[0-9a-fA-F]{40}", parts[0])
          ):
              raise SystemExit("GitLab remote observation returned malformed output")
          gitlab_remote_sha = parts[0].lower()
          gitlab_available = True
      elif gitlab_probe.returncode != 2:
          gitlab_available = False

      observed_at = datetime.now(timezone.utc).isoformat()
      Path("github-observation.json").write_text(
          json.dumps({
              "remote_url": observation.remote_url,
              "ref_name": observation.ref_name,
              "sha": observation.sha,
              "observed_at": observation.observed_at,
              "available": observation.available,
              "reason": observation.reason,
          }, sort_keys=True),
          encoding="utf-8",
      )
      runtime_identity = {
          "gitlab_project_id": expected_project_id,
          "gitlab_project_path": observed_project_path,
          "pipeline_id": pipeline_id,
          "ref_name": receipt["ref"],
          "pipeline_ref": trusted_ref,
          "source": job_source,
          "sha": head_sha,
          "gitlab_remote_sha": gitlab_remote_sha,
          "observed_at": observed_at,
          "worker_revision": receipt["worker_revision"],
      }
      Path("gitlab-runtime-identity.json").write_text(
          json.dumps(runtime_identity, sort_keys=True),
          encoding="utf-8",
      )
      payload = {
          "github_repository": "WhiteChronos/ChatGPT",
          "gitlab_project_id": expected_project_id,
          "gitlab_project_path": observed_project_path,
          "ref_name": receipt["ref"],
          "github_sha": observation.sha,
          "gitlab_sha": gitlab_remote_sha,
          "ci_subject_sha": head_sha,
          "github_available": observation.available,
          "gitlab_available": gitlab_available,
          "receipt_timestamp": receipt["timestamp"],
      }
      Path("mirror-input.json").write_text(json.dumps(payload, sort_keys=True), encoding="utf-8")
      PY
    - python pipeline/git_mirror_parity.py --input mirror-input.json --policy governance/GITLAB_CONTINGENCY_CI_POLICY.json --json > mirror-parity.json || true
    - cat mirror-parity.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - github-observation.json
      - gitlab-runtime-identity.json
      - mirror-input.json
      - mirror-parity.json
python-governance:
  stage: validate
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: mirror-parity
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip check
  script:
    - |
      set +e
      python pipeline/contingency_ci_gate.py --profile python-governance --json > contingency-python.json
      status=$?
      cat contingency-python.json
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - contingency-python.json

broker:
  stage: validate
  image: node:22.23.2-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9 # node:22.23.2-slim
  needs:
    - job: mirror-parity
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - |
      unset NODE_OPTIONS
      unset NODE_PATH
      set +e
      node --test plugins/subagent-broker/tests/*.test.mjs > broker-test.txt 2>&1
      status=$?
      if [ "$status" -eq 0 ]; then
        printf '%s\n' '{"profile":"broker","passed":true}' > contingency-broker.json
      else
        printf '%s\n' '{"profile":"broker","passed":false}' > contingency-broker.json
      fi
      cat broker-test.txt
      cat contingency-broker.json
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - broker-test.txt
      - contingency-broker.json

contingency-evidence:
  stage: evidence
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: mirror-parity
      artifacts: true
    - job: python-governance
      artifacts: true
    - job: broker
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-mirror.txt
    - python -m pip check
  script:
    - |
      python - <<'PY'
      import hashlib
      import json
      import os
      import re
      import subprocess
      from datetime import datetime, timezone
      from pathlib import Path

      from pipeline.ci_provider_evidence import (
          CIProviderEvidence,
          compare_provider_evidence,
          compute_provenance_sha256,
      )
      from pipeline.git_mirror_observation import observe_remote_ref
      from pipeline.git_mirror_parity import MirrorParityInput, evaluate_mirror_parity
      from pipeline.gitlab_contingency_policy import load_policy

      runtime_identity = json.loads(Path("gitlab-runtime-identity.json").read_text(encoding="utf-8"))
      mirror_input = json.loads(Path("mirror-input.json").read_text(encoding="utf-8"))
      python_gate = json.loads(Path("contingency-python.json").read_text(encoding="utf-8"))
      broker_gate = json.loads(Path("contingency-broker.json").read_text(encoding="utf-8"))

      ref_name = runtime_identity["ref_name"]
      github_observation_before = observe_remote_ref(
          "https://github.com/WhiteChronos/ChatGPT.git",
          ref_name,
      )
      safe_env = {
          key: value
          for key in ("PATH", "HOME", "LANG", "LC_ALL", "SYSTEMROOT", "WINDIR", "TMP", "TEMP", "TMPDIR")
          if (value := os.environ.get(key))
      }
      safe_env["GIT_CONFIG_NOSYSTEM"] = "1"
      safe_env["GIT_CONFIG_GLOBAL"] = os.devnull
      safe_env["GIT_TERMINAL_PROMPT"] = "0"
      full_ref = f"refs/heads/{ref_name}"
      gitlab_probe = subprocess.run(
          ["git", "ls-remote", "--exit-code", "origin", full_ref],
          check=False,
          text=True,
          capture_output=True,
          env=safe_env,
      )
      gitlab_remote_sha = None
      gitlab_available = False
      if gitlab_probe.returncode == 0:
          lines = [line.strip() for line in gitlab_probe.stdout.splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit("GitLab final remote observation returned malformed output")
          parts = lines[0].split()
          if len(parts) != 2 or parts[1] != full_ref or not re.fullmatch(r"[0-9a-fA-F]{40}", parts[0]):
              raise SystemExit("GitLab final remote observation returned malformed output")
          gitlab_remote_sha = parts[0].lower()
          gitlab_available = True
      elif gitlab_probe.returncode != 2:
          raise SystemExit("GitLab final remote observation failed")

      github_observation_after = observe_remote_ref(
          "https://github.com/WhiteChronos/ChatGPT.git",
          ref_name,
      )
      if (
          github_observation_before.available != github_observation_after.available
          or github_observation_before.sha != github_observation_after.sha
      ):
          raise SystemExit("authoritative GitHub ref changed during final evidence observation")

      receipt_timestamp = datetime.fromisoformat(
          str(mirror_input["receipt_timestamp"]).replace("Z", "+00:00")
      )
      evaluated_at = datetime.now(timezone.utc)
      final_parity_input = MirrorParityInput(
          github_repository="WhiteChronos/ChatGPT",
          gitlab_project_id=int(runtime_identity["gitlab_project_id"]),
          gitlab_project_path=runtime_identity["gitlab_project_path"],
          ref_name=ref_name,
          github_sha=github_observation_after.sha,
          gitlab_sha=gitlab_remote_sha,
          ci_subject_sha=runtime_identity["sha"],
          github_available=github_observation_after.available,
          gitlab_available=gitlab_available,
          receipt_timestamp=receipt_timestamp,
          evaluated_at=evaluated_at,
      )
      final_parity = evaluate_mirror_parity(
          final_parity_input,
          load_policy(Path("governance/GITLAB_CONTINGENCY_CI_POLICY.json")),
      )
      parity_payload = {
          "status": final_parity.status.value,
          "evidence_eligible": final_parity.evidence_eligible,
          "reason": final_parity.reason,
          "inputs": {
              "github_repository": "WhiteChronos/ChatGPT",
              "gitlab_project_id": int(runtime_identity["gitlab_project_id"]),
              "gitlab_project_path": runtime_identity["gitlab_project_path"],
              "ref_name": ref_name,
              "github_sha": github_observation_after.sha,
              "gitlab_sha": gitlab_remote_sha,
              "ci_subject_sha": runtime_identity["sha"],
              "github_available": github_observation_after.available,
              "gitlab_available": gitlab_available,
              "receipt_timestamp": receipt_timestamp.isoformat(),
              "evaluated_at": evaluated_at.isoformat(),
          },
      }
      Path("mirror-parity-final.json").write_text(
          json.dumps(parity_payload, sort_keys=True),
          encoding="utf-8",
      )

      validation_passed = bool(python_gate.get("passed")) and bool(broker_gate.get("passed"))
      parity_status = final_parity.status.value
      eligible = final_parity.evidence_eligible and validation_passed
      gate = {
          "profile": "full-contingency",
          "passed": validation_passed,
          "mirror_parity_status": parity_status,
          "evidence_eligible": eligible,
      }
      Path("contingency-gate.json").write_text(json.dumps(gate, sort_keys=True), encoding="utf-8")

      def digest(path: str) -> str:
          return hashlib.sha256(Path(path).read_bytes()).hexdigest()

      input_artifacts_sha256 = {
          name: digest(name)
          for name in (
              "mirror-input.json",
              "mirror-parity.json",
              "gitlab-runtime-identity.json",
              "contingency-python.json",
              "contingency-broker.json",
              "mirror-parity-final.json",
          )
      }
      retry_count = int(os.environ.get("CI_JOB_RETRY_COUNT", "0"))
      evidence_timestamp = datetime.now(timezone.utc)
      evidence = {
          "provider": "gitlab",
          "repository_identity": runtime_identity["gitlab_project_path"],
          "subject_sha": runtime_identity["sha"],
          "pipeline_or_run_id": runtime_identity["pipeline_id"],
          "gate_name": "full-contingency",
          "result": "PASS" if validation_passed else "FAIL",
          "timestamp": evidence_timestamp.isoformat(),
          "ci_config_revision": runtime_identity["sha"],
          "mirror_parity_status": parity_status,
          "attempt": retry_count + 1,
          "input_artifacts_sha256": input_artifacts_sha256,
          "worker_revision": runtime_identity["worker_revision"],
      }
      evidence["provenance_sha256"] = compute_provenance_sha256(evidence)
      Path("ci-provider-evidence.json").write_text(json.dumps(evidence, sort_keys=True), encoding="utf-8")

      evidence_record = CIProviderEvidence(
          **{**evidence, "timestamp": evidence_timestamp}
      )
      disposition = compare_provider_evidence(
          None,
          evidence_record,
          gitlab_live_verified=True,
          now=evidence_timestamp,
      )
      Path("evidence-disposition.json").write_text(
          json.dumps(
              {
                  "disposition": disposition.disposition.value,
                  "reason": disposition.reason,
                  "subject_sha": evidence_record.subject_sha,
                  "pipeline_or_run_id": evidence_record.pipeline_or_run_id,
                  "gitlab_live_verified": True,
              },
              sort_keys=True,
          ),
          encoding="utf-8",
      )
      PY
    - cat mirror-parity-final.json
    - cat contingency-gate.json
    - cat ci-provider-evidence.json
    - cat evidence-disposition.json
    - |
      if python - <<'PY'
      import json
      from pathlib import Path
      gate = json.loads(Path("contingency-gate.json").read_text())
      if not gate.get("passed") or not gate.get("evidence_eligible"):
          raise SystemExit(1)
      raise SystemExit(0)
      PY
      then
        true
      else
        exit 1
      fi
  artifacts:
    when: always
    expire_in: never
    paths:
      - mirror-input.json
      - mirror-parity.json
      - gitlab-runtime-identity.json
      - contingency-python.json
      - contingency-broker.json
      - mirror-parity-final.json
      - contingency-gate.json
      - ci-provider-evidence.json
      - evidence-disposition.json


cleanup-refresh:
  stage: cleanup
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: contingency-evidence
      artifacts: false
  when: always
  allow_failure: false
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - |
      set -euo pipefail
      case "${CI_COMMIT_BRANCH:-}" in
        whitechronos-refresh/*)
          python - "${CI_COMMIT_BRANCH}" <<'PY'
          import re
          import sys

          ref = sys.argv[1]
          if not re.fullmatch(r"whitechronos-refresh/[0-9a-f]{64}", ref):
              raise SystemExit("malformed reserved refresh ref")
          PY
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_TERMINAL_PROMPT=0
          git push origin --delete "${CI_COMMIT_BRANCH}"
          ;;
        *)
          echo "No refresh branch cleanup required."
          ;;
      esac

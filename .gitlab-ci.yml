stages:
  - parity
  - validate
  - evidence

default:
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

mirror-parity:
  stage: parity
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip check
  script:
    - |
      python - <<'PY'
      import json
      import os
      import re
      import subprocess
      from datetime import datetime, timezone
      from pathlib import Path
      from urllib.parse import urlsplit
      from urllib.request import Request, urlopen

      from pipeline.git_mirror_observation import observe_remote_ref

      policy = json.loads(Path("governance/GITLAB_CONTINGENCY_CI_POLICY.json").read_text(encoding="utf-8"))
      expected_project_id = int(policy["gitlab_project_id"])
      expected_project_path = policy["gitlab_project_path"]
      if not expected_project_path:
          raise SystemExit("GitLab project path is not provisioned")

      safe_env = {
          key: value
          for key in ("PATH", "HOME", "LANG", "LC_ALL", "SYSTEMROOT", "WINDIR", "TMP", "TEMP", "TMPDIR")
          if (value := os.environ.get(key))
      }
      safe_env["GIT_CONFIG_NOSYSTEM"] = "1"
      safe_env["GIT_CONFIG_GLOBAL"] = os.devnull
      safe_env["GIT_TERMINAL_PROMPT"] = "0"

      # trusted checkout identity source: git remote get-url origin
      def git(*args):
          return subprocess.run(
              ["git", *args],
              check=True,
              text=True,
              capture_output=True,
              env=safe_env,
          ).stdout.strip()

      head_sha = git("rev-parse", "HEAD").lower()
      origin_url = git("remote", "get-url", "origin")
      if origin_url.startswith("git@gitlab.com:"):
          observed_project_path = origin_url.split(":", 1)[1]
      else:
          parsed = urlsplit(origin_url)
          if parsed.scheme != "https" or (parsed.hostname or "").lower() != "gitlab.com":
              raise SystemExit("checkout origin is not GitLab.com")
          observed_project_path = parsed.path.lstrip("/")
      if observed_project_path.endswith(".git"):
          observed_project_path = observed_project_path[:-4]
      if observed_project_path != expected_project_path:
          raise SystemExit("checkout project path does not match provisioned mirror policy")

      token = os.environ.get("CI_JOB_TOKEN")
      if not token:
          raise SystemExit("CI_JOB_TOKEN is required for trusted GitLab job identity")
      request = Request(
          "https://gitlab.com/api/v4/job",
          headers={"JOB-TOKEN": token, "Accept": "application/json"},
      )
      with urlopen(request, timeout=20) as response:
          job = json.load(response)

      pipeline = job.get("pipeline") or {}
      commit = job.get("commit") or {}
      if int(pipeline.get("project_id", 0)) != expected_project_id:
          raise SystemExit("job-token project ID does not match provisioned mirror policy")
      if str(pipeline.get("sha", "")).lower() != head_sha or str(commit.get("id", "")).lower() != head_sha:
          raise SystemExit("job-token commit identity does not match checkout HEAD")
      trusted_ref = str(job.get("ref", "")).strip()
      if not trusted_ref:
          raise SystemExit("job-token response did not provide a ref")
      job_source = str(job.get("source", "")).strip()
      pipeline_id = str(pipeline.get("id", "")).strip()
      if not pipeline_id:
          raise SystemExit("job-token response did not provide a pipeline ID")
      if job_source != "push":
          raise SystemExit("eligible mirror evidence requires a trusted push pipeline from the neutral worker")

      receipt = {
          "schema_version": 1,
          "transport": os.environ.get("WHITECHRONOS_MIRROR_TRANSPORT", ""),
          "source_repository": os.environ.get("WHITECHRONOS_MIRROR_SOURCE_REPOSITORY", ""),
          "target_project_path": os.environ.get("WHITECHRONOS_MIRROR_TARGET_PROJECT", ""),
          "ref": os.environ.get("WHITECHRONOS_MIRROR_REF", ""),
          "source_sha": os.environ.get("WHITECHRONOS_MIRROR_SOURCE_SHA", "").lower(),
          "target_sha": os.environ.get("WHITECHRONOS_MIRROR_TARGET_SHA", "").lower(),
          "timestamp": os.environ.get("WHITECHRONOS_MIRROR_TIMESTAMP", ""),
      }
      receipt_digest = os.environ.get("WHITECHRONOS_MIRROR_RECEIPT_SHA256", "").lower()
      if not receipt_digest:
          raise SystemExit("neutral worker mirror receipt digest is required")
      import hashlib
      import hmac
      expected_receipt_digest = hashlib.sha256(
          json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode("utf-8")
      ).hexdigest()
      if not hmac.compare_digest(receipt_digest, expected_receipt_digest):
          raise SystemExit("mirror receipt digest mismatch")
      if receipt["transport"] != "neutral_worker":
          raise SystemExit("mirror receipt transport mismatch")
      if receipt["source_repository"] != policy["source_repository"]:
          raise SystemExit("mirror receipt source repository mismatch")
      if receipt["target_project_path"] != expected_project_path:
          raise SystemExit("mirror receipt target project mismatch")
      if receipt["ref"] != trusted_ref:
          raise SystemExit("mirror receipt ref mismatch")
      if receipt["source_sha"] != head_sha or receipt["target_sha"] != head_sha:
          raise SystemExit("mirror receipt SHA mismatch")
      try:
          datetime.fromisoformat(str(receipt["timestamp"]).replace("Z", "+00:00"))
      except ValueError as exc:
          raise SystemExit("mirror receipt timestamp is invalid") from exc

      observation = observe_remote_ref(
          "https://github.com/WhiteChronos/ChatGPT.git",
          trusted_ref,
      )
      full_ref = f"refs/heads/{trusted_ref}"
      gitlab_probe = subprocess.run(
          ["git", "ls-remote", "--exit-code", "origin", full_ref],
          check=False,
          text=True,
          capture_output=True,
          env=safe_env,
      )
      gitlab_remote_sha = None
      gitlab_available = False
      if gitlab_probe.returncode == 0:
          lines = [line.strip() for line in gitlab_probe.stdout.splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit("GitLab remote observation returned malformed output")
          parts = lines[0].split()
          if (
              len(parts) != 2
              or parts[1] != full_ref
              or not re.fullmatch(r"[0-9a-fA-F]{40}", parts[0])
          ):
              raise SystemExit("GitLab remote observation returned malformed output")
          gitlab_remote_sha = parts[0].lower()
          gitlab_available = True
      elif gitlab_probe.returncode != 2:
          gitlab_available = False

      observed_at = datetime.now(timezone.utc).isoformat()
      Path("github-observation.json").write_text(
          json.dumps({
              "remote_url": observation.remote_url,
              "ref_name": observation.ref_name,
              "sha": observation.sha,
              "observed_at": observation.observed_at,
              "available": observation.available,
              "reason": observation.reason,
          }, sort_keys=True),
          encoding="utf-8",
      )
      runtime_identity = {
          "gitlab_project_id": expected_project_id,
          "gitlab_project_path": observed_project_path,
          "pipeline_id": pipeline_id,
          "ref_name": trusted_ref,
          "source": job_source,
          "sha": head_sha,
          "gitlab_remote_sha": gitlab_remote_sha,
          "observed_at": observed_at,
      }
      Path("gitlab-runtime-identity.json").write_text(
          json.dumps(runtime_identity, sort_keys=True),
          encoding="utf-8",
      )
      payload = {
          "github_repository": "WhiteChronos/ChatGPT",
          "gitlab_project_id": expected_project_id,
          "gitlab_project_path": observed_project_path,
          "ref_name": trusted_ref,
          "github_sha": observation.sha,
          "gitlab_sha": gitlab_remote_sha,
          "ci_subject_sha": head_sha,
          "github_available": observation.available,
          "gitlab_available": gitlab_available,
          "receipt_timestamp": receipt["timestamp"],
      }
      Path("mirror-input.json").write_text(json.dumps(payload, sort_keys=True), encoding="utf-8")
      PY
    - python pipeline/git_mirror_parity.py --input mirror-input.json --policy governance/GITLAB_CONTINGENCY_CI_POLICY.json --json > mirror-parity.json || true
    - cat mirror-parity.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - github-observation.json
      - gitlab-runtime-identity.json
      - mirror-input.json
      - mirror-parity.json
python-governance:
  stage: validate
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: mirror-parity
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip check
  script:
    - |
      set +e
      python pipeline/contingency_ci_gate.py --profile python-governance --json > contingency-python.json
      status=$?
      cat contingency-python.json
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - contingency-python.json

broker:
  stage: validate
  image: node:22.23.2-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9 # node:22.23.2-slim
  needs:
    - job: mirror-parity
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - |
      unset NODE_OPTIONS
      unset NODE_PATH
      set +e
      node --test plugins/subagent-broker/tests/*.test.mjs > broker-test.txt 2>&1
      status=$?
      if [ "$status" -eq 0 ]; then
        printf '%s\n' '{"profile":"broker","passed":true}' > contingency-broker.json
      else
        printf '%s\n' '{"profile":"broker","passed":false}' > contingency-broker.json
      fi
      cat broker-test.txt
      cat contingency-broker.json
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - broker-test.txt
      - contingency-broker.json

contingency-evidence:
  stage: evidence
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: mirror-parity
      artifacts: true
    - job: python-governance
      artifacts: true
    - job: broker
      artifacts: true
  when: always
  script:
    - |
      python - <<'PY'
      import json
      from datetime import datetime, timezone
      from pathlib import Path

      from pipeline.ci_provider_evidence import compute_provenance_sha256

      parity = json.loads(Path("mirror-parity.json").read_text(encoding="utf-8"))
      runtime_identity = json.loads(Path("gitlab-runtime-identity.json").read_text(encoding="utf-8"))
      python_gate = json.loads(Path("contingency-python.json").read_text(encoding="utf-8"))
      broker_gate = json.loads(Path("contingency-broker.json").read_text(encoding="utf-8"))
      validation_passed = bool(python_gate.get("passed")) and bool(broker_gate.get("passed"))
      parity_status = parity.get("status", "UNAVAILABLE")
      eligible = parity_status == "HEALTHY" and validation_passed
      gate = {
          "profile": "full-contingency",
          "passed": validation_passed,
          "mirror_parity_status": parity_status,
          "evidence_eligible": eligible,
      }
      Path("contingency-gate.json").write_text(json.dumps(gate, sort_keys=True), encoding="utf-8")
      evidence = {
          "provider": "gitlab",
          "repository_identity": runtime_identity["gitlab_project_path"],
          "subject_sha": runtime_identity["sha"],
          "pipeline_or_run_id": runtime_identity["pipeline_id"],
          "gate_name": "full-contingency",
          "result": "PASS" if validation_passed else "FAIL",
          "timestamp": datetime.now(timezone.utc).isoformat(),
          "ci_config_revision": runtime_identity["sha"],
          "mirror_parity_status": parity_status,
          "attempt": 1,
      }
      evidence["provenance_sha256"] = compute_provenance_sha256(evidence)
      Path("ci-provider-evidence.json").write_text(json.dumps(evidence, sort_keys=True), encoding="utf-8")
      PY
    - cat contingency-gate.json
    - cat ci-provider-evidence.json
    - |
      if python - <<'PY'
      import json
      from pathlib import Path
      gate = json.loads(Path("contingency-gate.json").read_text())
      if not gate.get("passed") or not gate.get("evidence_eligible"):
          raise SystemExit(1)
      raise SystemExit(0)
      PY
      then
        true
      else
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - mirror-parity.json
      - contingency-gate.json
      - ci-provider-evidence.json

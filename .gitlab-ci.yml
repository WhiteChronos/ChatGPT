stages:
  - parity
  - validate
  - evidence

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

mirror-parity:
  stage: parity
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip check
  script:
    - python pipeline/git_mirror_observation.py --remote-url "https://github.com/WhiteChronos/ChatGPT.git" --ref "$CI_COMMIT_REF_NAME" --json > github-observation.json || true
    - |
      python - <<'PY'
      import json
      import os
      from datetime import datetime, timezone
      from pathlib import Path

      try:
          observation = json.loads(Path("github-observation.json").read_text(encoding="utf-8"))
      except Exception:
          observation = {"available": False, "sha": None}
      payload = {
          "github_repository": "WhiteChronos/ChatGPT",
          "gitlab_project_id": int(os.environ["CI_PROJECT_ID"]),
          "gitlab_project_path": os.environ["CI_PROJECT_PATH"],
          "ref_name": os.environ["CI_COMMIT_REF_NAME"],
          "github_sha": observation.get("sha"),
          "gitlab_sha": os.environ["CI_COMMIT_SHA"],
          "ci_subject_sha": os.environ["CI_COMMIT_SHA"],
          "github_available": bool(observation.get("available")),
          "gitlab_available": True,
          "receipt_timestamp": (
              os.environ.get("CI_PIPELINE_CREATED_AT", datetime.now(timezone.utc).isoformat())
              if os.environ.get("CI_PIPELINE_SOURCE") == "push"
              else "1970-01-01T00:00:00+00:00"
          ),
      }
      Path("mirror-input.json").write_text(json.dumps(payload, sort_keys=True), encoding="utf-8")
      PY
    - python pipeline/git_mirror_parity.py --input mirror-input.json --policy governance/GITLAB_CONTINGENCY_CI_POLICY.json --json > mirror-parity.json || true
    - cat mirror-parity.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - github-observation.json
      - mirror-input.json
      - mirror-parity.json

python-governance:
  stage: validate
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: mirror-parity
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip check
  script:
    - |
      set +e
      python pipeline/contingency_ci_gate.py --profile python-governance --json > contingency-python.json
      status=$?
      cat contingency-python.json
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - contingency-python.json

broker:
  stage: validate
  image: node:22.23.2-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9 # node:22.23.2-slim
  needs:
    - job: mirror-parity
      artifacts: true
  when: always
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - |
      set +e
      node --test plugins/subagent-broker/tests/*.test.mjs > broker-test.txt 2>&1
      status=$?
      if [ "$status" -eq 0 ]; then
        printf '%s\n' '{"profile":"broker","passed":true}' > contingency-broker.json
      else
        printf '%s\n' '{"profile":"broker","passed":false}' > contingency-broker.json
      fi
      cat broker-test.txt
      cat contingency-broker.json
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - broker-test.txt
      - contingency-broker.json

contingency-evidence:
  stage: evidence
  image: python:3.12.13-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 # python:3.12.13-slim
  needs:
    - job: mirror-parity
      artifacts: true
    - job: python-governance
      artifacts: true
    - job: broker
      artifacts: true
  when: always
  script:
    - |
      python - <<'PY'
      import hashlib
      import json
      import os
      from datetime import datetime, timezone
      from pathlib import Path

      parity = json.loads(Path("mirror-parity.json").read_text(encoding="utf-8"))
      python_gate = json.loads(Path("contingency-python.json").read_text(encoding="utf-8"))
      broker_gate = json.loads(Path("contingency-broker.json").read_text(encoding="utf-8"))
      validation_passed = bool(python_gate.get("passed")) and bool(broker_gate.get("passed"))
      parity_status = parity.get("status", "UNAVAILABLE")
      eligible = parity_status == "HEALTHY" and validation_passed
      gate = {
          "profile": "full-contingency",
          "passed": validation_passed,
          "mirror_parity_status": parity_status,
          "evidence_eligible": eligible,
      }
      Path("contingency-gate.json").write_text(json.dumps(gate, sort_keys=True), encoding="utf-8")
      evidence = {
          "provider": "gitlab",
          "repository_identity": os.environ["CI_PROJECT_PATH"],
          "subject_sha": os.environ["CI_COMMIT_SHA"],
          "pipeline_or_run_id": os.environ["CI_PIPELINE_ID"],
          "gate_name": "full-contingency",
          "result": "PASS" if validation_passed else "FAIL",
          "timestamp": datetime.now(timezone.utc).isoformat(),
          "ci_config_revision": os.environ["CI_COMMIT_SHA"],
          "mirror_parity_status": parity_status,
          "attempt": 1,
      }
      provenance_payload = {
          key: evidence[key]
          for key in (
              "provider",
              "repository_identity",
              "subject_sha",
              "pipeline_or_run_id",
              "gate_name",
              "ci_config_revision",
          )
      }
      encoded = json.dumps(provenance_payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
      evidence["provenance_sha256"] = hashlib.sha256(encoded).hexdigest()
      Path("ci-provider-evidence.json").write_text(json.dumps(evidence, sort_keys=True), encoding="utf-8")
      PY
    - cat contingency-gate.json
    - cat ci-provider-evidence.json
    - |
      if python - <<'PY'
      import json
      from pathlib import Path
      gate = json.loads(Path("contingency-gate.json").read_text())
      if not gate.get("passed") or not gate.get("evidence_eligible"):
          raise SystemExit(1)
      raise SystemExit(0)
      PY
      then
        true
      else
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - mirror-parity.json
      - contingency-gate.json
      - ci-provider-evidence.json

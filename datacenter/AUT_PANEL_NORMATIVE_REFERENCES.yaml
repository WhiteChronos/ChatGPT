schema_version: "1.0"
registry_id: AUT-PANEL-NORMATIVE-REFERENCES-V1
standard_id: AUT-PAINEL-COMPACT-V2.4
status: CONTROLLED_ACTIVE
scope: >-
  Registro normativo para elaboração, seleção, dimensionamento, layout, documentação,
  automação, comunicação, QA e emissão de quadros de automação de baixa tensão.
  O registro contém referências-base e referências condicionais; normas específicas
  do contrato, cliente, local de instalação ou equipamento devem ser adicionadas quando aplicáveis.
jurisdiction_default: BR
verified_at: "2026-09-28"
reverify_before_release: true
copyright_policy:
  store_metadata_not_normative_text: true
  do_not_copy_paid_standard_content: true
  use_official_metadata_and_project_licensed_copies: true
applicability_policy:
  project_specific_requirement_precedence: true
  legal_requirements_precedence: true
  national_adoption_preferred_when_applicable: true
  manufacturer_product_standard_still_required: true
  unverified_edition_status: HOLD
  conflicting_requirements_status: HOLD
  missing_applicability_decision_status: HOLD
  release_requires_normative_reverification: true
  international_reference_does_not_imply_brazilian_adoption: true
classification:
  BASELINE:
    meaning: Revisar em toda elaboração de quadro AUT de baixa tensão, conforme escopo.
  CONDITIONAL:
    meaning: Ativar somente quando a característica técnica indicada estiver presente.
  LEGAL_BR:
    meaning: Requisito legal/regulamentar brasileiro aplicável ao escopo indicado.
source_authority:
  - legislação/regulamentação oficial
  - catálogo oficial ABNT
  - webstore oficial IEC
  - catálogo oficial ISO
  - documento licenciado do projeto
  - fonte secundária apenas para localização, nunca para emissão

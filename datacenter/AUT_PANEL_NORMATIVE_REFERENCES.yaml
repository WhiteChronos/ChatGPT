coverage_policy:
  registry_is_extensible: true
  universal_exhaustiveness_claimed: false
  uncovered_project_feature_status: HOLD
  uncovered_project_feature_action: TECHNICAL_RESEARCH_OFFICIAL_NORM_DISCOVERY
  required_for_each_new_feature:
    - jurisdiction
    - product_or_system_scope
    - applicable_legal_requirements
    - applicable_national_standards
    - applicable_international_standards
    - manufacturer_declared_product_standards
    - official_source_validation
    - two_agent_validation
release_evidence:
  required_fields:
    - normative_reference_id
    - reference
    - applicability_decision
    - edition_reverified_at
    - official_source_url
    - project_requirement_or_reason
    - impacted_artifacts
    - validator_a
    - validator_b
  rule: >-
    Para emissão, toda referência ativada deve ter edição vigente reverificada em fonte oficial.
    Referência com source_status diferente de OFFICIAL_VERIFIED, OFFICIAL_CATALOG_VERIFIED
    ou OFFICIAL_VERIFIED_TRANSITION permanece HOLD até verificação.

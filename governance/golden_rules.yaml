schema_version: '1.1'
registry_id: GOLDEN-RULES-IMMUTABLE-V1
standard_id: AUT-PAINEL-COMPACT-V2.4
status: LOCKED_APPROVED_STANDARD
immutable: true
change_control:
  explicit_user_authorization_required: true
  unauthorized_change_status: REPROVADO
  authorization_evidence_required: true
  rule: Nenhuma regra, estrutura de LI/Excel, composição visual, dimensão mestre, ordem do pipeline ou
    template aprovado pode ser alterado sem autorização explícita do responsável do projeto.
required_rules:
- id: GR-021
  name: Vista frontal externa é a geometria-mestra
  severity_on_violation: REPROVADO
  rule: A vista frontal externa/porta define largura e altura externas do gabinete.
- id: GR-022
  name: Vista interna frontal preserva o contorno externo
  severity_on_violation: REPROVADO
  rule: A vista interna frontal deve ter exatamente a mesma largura e altura externas da vista frontal externa.
- id: GR-023
  name: Vista lateral real
  severity_on_violation: REPROVADO
  rule: A vista lateral deve ser profundidade externa x altura externa.
- id: GR-024
  name: Escala global única
  severity_on_violation: REPROVADO
  rule: Todas as vistas usam um único PX_PER_MM; escala por vista é proibida.
- id: GR-025
  name: Proporção 1:1
  severity_on_violation: REPROVADO
  rule: É proibida escala individual ou distorção de componentes.
- id: GR-026
  name: Canvas grow-only
  severity_on_violation: REPROVADO
  rule: O canvas cresce para acomodar o quadro; o quadro nunca é comprimido.
- id: GR-027
  name: Zona inferior normativa
  severity_on_violation: HOLD
  rule: Bornes, canaleta inferior, curvatura/saída de cabos e prensa-cabos devem permanecer em zonas distintas.
- id: GR-034
  name: LI e BOM antes do desenho
  severity_on_violation: REPROVADO
  rule: A LI quantitativa é congelada antes da BOM; a BOM é validada antes do layout e da imagem.
- id: GR-035
  name: Paridade quantitativa
  severity_on_violation: REPROVADO
  rule: catalog_id e quantidade devem ser idênticos entre LI, BOM, Data Sheet/layout e desenho.
- id: GR-036
  name: Mudança da LI invalida artefatos posteriores
  severity_on_violation: REPROVADO
  rule: Alterar quantidade, catalog_id ou revisão da LI invalida BOM, layout, desenho, carga e QA anteriores.
- id: GR-037
  name: IHM na porta
  severity_on_violation: REPROVADO
  rule: A IHM local fica obrigatoriamente instalada na porta/tampa frontal externa.
- id: GR-038
  name: Sem distorção para caber
  severity_on_violation: REPROVADO
  rule: Se faltar espaço, reorganizar ou ampliar o gabinete; nunca reduzir ou deformar componentes.
- id: GR-039
  name: PN-AUT-01 é o template mestre de Excel
  severity_on_violation: REPROVADO
  rule: PN-AUT-02 e futuros quadros devem manter a estrutura documental e visual do workbook mestre do PN-AUT-01.
- id: GR-040
  name: Imagem individual no padrão visual aprovado
  severity_on_violation: REPROVADO
  rule: Cada painel possui uma imagem própria e deve seguir seu template visual aprovado, sem recomposição automática.
- id: GR-041
  name: Padrão aprovado imutável
  severity_on_violation: REPROVADO
  rule: Nenhum padrão aprovado pode ser alterado sem autorização explícita do usuário.
- id: GR-042
  name: Baseline da LI imutável
  severity_on_violation: REPROVADO
  rule: LI-PN-AUT-01-R02 e LI-PN-AUT-02-R02 são baselines congeladas; mudança exige nova revisão e autorização explícita.
- id: GR-043
  name: Estrutura do workbook imutável
  severity_on_violation: REPROVADO
  rule: Ordem de abas, dimensões de planilha, freeze panes, mesclagens, larguras e alturas-base devem seguir o fingerprint estrutural mestre.
- id: GR-044
  name: Fingerprint visual aprovado
  severity_on_violation: REPROVADO
  rule: O template de imagem deve apontar para o fingerprint SHA-256 da referência aprovada do painel no Data Center privado.
- id: GR-045
  name: Prompt mestre obrigatório
  severity_on_violation: REPROVADO
  rule: Toda elaboração automática de LI, layout, código ou imagem deve carregar PROMPT-MASTER-AUT-PANEL-V2 sem reescrever suas regras imutáveis.
- id: GR-046
  name: Bootstrap de conversa obrigatório
  severity_on_violation: REPROVADO
  rule: Toda nova conversa deve carregar e validar Prompt Mestre, Golden Rules, pipeline, Data Center, Data Sheet, template e memória operacional antes de executar tarefa técnica.
- id: GR-047
  name: Memória operacional compartilhada
  severity_on_violation: REPROVADO
  rule: As conversas usam context/AUT_PANEL_CONVERSATION_MEMORY.yaml como memória operacional comum; immutable_contract é bloqueado e mutable_state é sincronizado após marcos definidos.
- id: GR-048
  name: Contrato dos comandos /explaincode e /refactor
  severity_on_violation: REPROVADO
  rule: /explaincode é somente leitura; /refactor deve preservar comportamento, executar regressão/QA e não alterar contratos bloqueados sem autorização explícita.
- id: GR-049
  name: Precedência canônica entre conversa e arquivos
  severity_on_violation: REPROVADO
  rule: Conversa ou memória informal nunca sobrescrevem Data Center, Data Sheet, LI ou Golden Rules; conflitos são resolvidos pela precedência canônica e qualquer lacuna crítica vira HOLD.
- id: GR-050
  name: Revisões históricas da LI são imutáveis
  severity_on_violation: REPROVADO
  rule: Toda coluna de revisão já emitida permanece exatamente como estava. Nunca corrigir REV. 0, REV. A ou outra revisão histórica em lugar da nova revisão.
- id: GR-051
  name: Nova revisão ocupa a coluna imediatamente à direita
  severity_on_violation: REPROVADO
  rule: A nova revisão deve ser criada na coluna imediatamente à direita da última revisão existente, preservando REV. 0 e todas as demais revisões anteriores.
- id: GR-052
  name: Quantitativo da nova revisão exige evidência rastreável
  severity_on_violation: REPROVADO
  rule: Valores da nova revisão só podem ser preenchidos por desenho oficial, desenho de painel aprovado, workbook de referência aprovado, Data Center/Data Sheet, documentação oficial do fabricante ou cálculo determinístico derivado dessas fontes.
- id: GR-053
  name: A LEVANTAR somente quando o quantitativo não puder ser determinado
  severity_on_violation: HOLD
  rule: A LEVANTAR exige justificativa e lacuna de fonte. Se a quantidade puder ser contada ou calculada a partir das fontes autorizadas, deve ser preenchida na nova revisão.
- id: GR-054
  name: Capa e formato da LI permanecem preservados
  severity_on_violation: REPROVADO
  rule: Revisão de conteúdo não autoriza alterar capa, ordem/nome das folhas, mesclagens, larguras estruturais, área de impressão, cabeçalhos, rodapés ou configuração de página sem autorização explícita.
- id: GR-055
  name: QA de revisão exige diff estrutural e histórico
  severity_on_violation: REPROVADO
  rule: Toda atualização de LI deve comparar baseline x nova versão e provar que revisões históricas e estrutura protegida não mudaram.
- id: GR-056
  name: Memória de controle da LI é obrigatória
  severity_on_violation: HOLD
  rule: Cada revisão deve registrar evento, fontes, folhas alteradas, coluna anterior, nova coluna, itens modificados, pendências, QA e testes de regressão em memory/LI_MATERIAL_CONTROL_MEMORY.yaml.
- id: GR-057
  name: Divergência entre fontes não corrige revisão antiga
  severity_on_violation: HOLD
  rule: Em conflito de fontes, a revisão histórica permanece intocada; a nova revisão fica HOLD até reconciliação e só então recebe o valor correto.
- id: GR-058
  name: QA open source em camadas
  severity_on_violation: HOLD
  rule: O pipeline deve usar o núcleo local de validação e registrar a cobertura de ferramentas open source opcionais; ausência de ferramenta opcional não pode ser mascarada como validação total.

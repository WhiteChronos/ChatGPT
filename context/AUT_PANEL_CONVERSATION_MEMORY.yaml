      li_id: LI-PN-AUT-02-R02
      li_revision: R02
      li_status: QUANTITY_FROZEN
      enclosure_mm: {height: 500, width: 400, depth: 250}
      mounting_plate_mm: {height: 450, width: 350}
      hmi_surface: door
      mandatory_power_chain: [power_supply_24vdc, dc_ups_24vdc, battery_bank]
  engineering_status:
    quantitative_baseline: FROZEN_R02
    formal_release: HOLD
    reason: >-
      Há itens ainda pendentes de código exato, dimensões, lifecycle, compatibilidade
      ou documentação oficial; CI pode passar sem liberar engenharia.
  open_holds:
    - id: HOLD-PLC-EXACT
      scope: PN-AUT-01
      item: PLC CPU e módulos ET 200SP
      reason: código exato deve ser congelado somente após I/O oficial e compatibilidade.
    - id: HOLD-RTU-EXACT
      scope: PN-AUT-02
      item: UTR e cartões de I/O
      reason: modelo e ecossistema de expansão precisam de compatibilidade oficial.
    - id: HOLD-SWITCH-LIFECYCLE
      scope: PN-AUT-01/PN-AUT-02
      item: switch industrial
      reason: referência SCALANCE X208 é legada e sucessor atual deve ser validado.
    - id: HOLD-BATTERY-SIZING
      scope: PN-AUT-01/PN-AUT-02
      item: banco de baterias
      reason: Ah/autonomia devem ser calculados pela carga real e requisito de autonomia.
    - id: HOLD-GATEWAY-VRF
      scope: PN-AUT-01
      item: gateway VRF
      reason: manter somente código oficial verificado; referência visual não é evidência.
  command_contract:
    explaincode:
      slash: /explaincode
      mode: READ_ONLY
      behavior: Explica código em partes sem modificar o alvo.
    refactor:
      slash: /refactor
      mode: BEHAVIOR_PRESERVING_WRITE
      behavior: Melhora estrutura sem mudar comportamento esperado e exige regressão/QA.

sync_policy:
  mandatory_read_on_new_conversation: true
  mandatory_write_after:
    - user_authorized_standard_change
    - new_li_revision
    - exact_model_frozen
    - qa_status_change
    - release_decision
    - major_pipeline_change
  conflict_resolution:
    chat_vs_memory: MEMORY_FILE_WINS
    memory_vs_datacenter: DATACENTER_WINS_AND_MEMORY_MUST_BE_REPAIRED
    memory_vs_datasheet: DATASHEET_WINS_AND_MEMORY_MUST_BE_REPAIRED
    missing_evidence: HOLD
    standard_violation: REPROVADO

history:
  - revision: 1
    at: "2026-09-15T20:08:00-03:00"
    actor: user+assistant
    event: CONVERSATION_BRIDGE_CREATED
    summary: >-
      Usuário autorizou criar um prompt portátil, memória operacional vinculada entre
      conversas, comandos /explaincode e /refactor e integração desses contratos ao pipeline.

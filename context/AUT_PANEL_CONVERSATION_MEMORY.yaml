schema_version: "1.0"
memory_id: AUT-PANEL-CONVERSATION-BRIDGE-V1
memory_type: OPERATIONAL_CROSS_CHAT_CONTEXT
status: ACTIVE
purpose: >-
  Estado operacional canônico para continuidade do projeto AUTOMAÇÃO EQUIPAMENTO
  entre conversas. Não substitui Golden Rules, Data Center, Data Sheet ou LI.

immutable_contract:
  standard_id: AUT-PAINEL-COMPACT-V2.4
  pipeline_id: AUT-PANEL-IMMUTABLE-V1.6
  prompt_master_id: PROMPT-MASTER-AUT-PANEL-V2
  golden_rules_id: GOLDEN-RULES-IMMUTABLE-V1
  datacenter_id: AUT-PANEL-DATACENTER-IMMUTABLE-V1
  datasheet_registry_id: AUT-PANEL-DATASHEET-IMMUTABLE-V1
  workbook_template_id: XLSX-PN-AUT-01-MASTER-R02
  image_visual_standard_id: IMG-AUT-PANEL-MASTER-V1
  repository: WhiteChronos/ChatGPT
  source_precedence:
    - governance/golden_rules.yaml
    - pipeline/pipeline.yaml
    - datacenter/datacenter.yaml
    - datasheet/datasheet.yaml
    - li vigente
    - templates/panel_template.yaml
    - context/AUT_PANEL_CONVERSATION_MEMORY.yaml
    - conversa atual
  mutation_policy:
    explicit_user_authorization_required_for_immutable_contract: true
    chat_memory_cannot_override_canonical_files: true
    fail_closed: true

mutable_state:
  sync_revision: 1
  last_sync_at: "2026-09-15T20:08:00-03:00"
  repository:
    branch: feat/aut-panel-control-v1
    pull_request: 23
    head_sha: PENDING_FINAL_SYNC
  active_work:
    objective: >-
      Consolidar prompt portátil entre conversas, memória operacional compartilhada,
      comandos /explaincode e /refactor e validação fail-closed dentro do pipeline.
    status: IN_PROGRESS
  active_panels:

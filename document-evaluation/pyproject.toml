[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "document-evaluation-system"
version = "0.1.0"
description = "Governed multidisciplinary engineering document evaluation engine"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[project.scripts]
document-evaluate = "document_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

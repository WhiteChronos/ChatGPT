<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat local SponsoredTokens</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">Privado no seu computador</p>
      <h1>Chat local SponsoredTokens</h1>
      <p class="intro">O historico desta pagina fica somente na memoria e desaparece ao atualizar.</p>
      <dl class="metadata">
        <div><dt>Status</dt><dd id="status" aria-live="polite">Verificando...</dd></div>
        <div><dt>Provedor</dt><dd id="provider">SponsoredTokens</dd></div>
        <div><dt>Modelo</dt><dd id="model">-</dd></div>
        <div><dt>Roteador</dt><dd id="router">Verificando...</dd></div>
      </dl>
    </header>
    <section class="chat" aria-label="Conversa local">
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <p id="empty-state" class="empty-state">Envie uma mensagem para iniciar a conversa.</p>
    </section>
    <form id="composer" class="composer">
      <label for="message-input">Mensagem</label>
      <textarea id="message-input" rows="4" maxlength="20000" required placeholder="Escreva aqui. Shift+Enter cria uma nova linha."></textarea>
      <div class="actions">
        <button id="send" type="submit">Enviar</button>
        <button id="retry" type="button" hidden>Repetir envio</button>
        <button id="clear" type="button">Limpar conversa</button>
      </div>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>

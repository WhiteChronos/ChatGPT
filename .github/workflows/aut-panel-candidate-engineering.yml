name: AUT Panel Candidate Engineering

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Candidate revision ID to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile candidate modules
        run: |
          python -m compileall -q \
            pipeline/aut_panel_candidate_revision.py \
            pipeline/aut_panel_candidate_runner.py \
            pipeline/aut_panel_candidate_gate.py
      - name: Run candidate regression tests
        run: python -m pytest -q tests/test_aut_panel_candidate_*.py
      - name: Verify runner and human-release boundary imports
        run: |
          python - <<'PY'
          import json
          import os
          from pipeline.aut_panel_candidate_runner import build_candidate_execution_plan
          from pipeline.aut_panel_candidate_gate import evaluate_candidate
          pipeline = {"sequence": [
              {"order": 10, "id": "QA"},
              {"order": 20, "id": "MEMORY_SYNC"},
              {"order": 30, "id": "RELEASE"},
          ]}
          plan = build_candidate_execution_plan(
              {"changes": [{"invalidates": ["QA", "MEMORY_SYNC", "RELEASE"]}]},
              pipeline,
          )
          assert plan == ["QA", "MEMORY_SYNC"]
          manifest = {
              "candidate_id": os.environ["CANDIDATE_ID"],
              "qa_status": "PASS",
              "deterministic_status": "PASS",
              "blocking_holds": [],
              "source_hashes": {"commit": "a" * 64},
              "artifact_hashes": {"manifest": "b" * 64},
              "rollback_target": "HISTORICAL_BASELINE",
          }
          result = evaluate_candidate(manifest)
          assert result["status"] == "CANDIDATE_READY_FOR_HUMAN_REVIEW"
          out = {
              "candidate_id": os.environ["CANDIDATE_ID"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "planned_stages": plan,
              "candidate_gate": result,
          }
          from pathlib import Path
          Path("build/candidate").mkdir(parents=True, exist_ok=True)
          Path("build/candidate/status.json").write_text(json.dumps(out, indent=2), encoding="utf-8")
          PY
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: aut-panel-candidate-${{ github.sha }}-${{ inputs.candidate_id }}
          path: build/candidate/
          if-no-files-found: error

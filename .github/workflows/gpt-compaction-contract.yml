name: GPT Compaction Contract Tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/gpt_compaction_adapter.py'
      - 'tests/test_gpt_compaction_adapter.py'
      - '.github/workflows/gpt-compaction-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Offline contract tests, no API requests
        run: python -m unittest discover -s tests -p 'test_gpt_compaction_adapter.py' -v

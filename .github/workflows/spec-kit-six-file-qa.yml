name: Spec Kit Six-File QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/spec-kit-decisions-board/**'
      - 'tools/spec_kit_six_file_validator.py'
      - 'tests/test_spec_kit_six_file_validator.py'
      - 'tests/test_spec_kit_decisions_board.py'
      - 'tests/test_spec_kit_codex_skill_bridge.py'
      - '.agents/skills/spec-kit-*/**'
      - 'skills/spec-kit-*/**'
      - 'examples/spec_kit_decisions_board/**'
      - '.github/workflows/spec-kit-six-file-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-file-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Six-file contract tests
        run: python -m unittest discover -s tests -p 'test_spec_kit_six_file_validator.py' -v
      - name: Decisions Board behavior tests
        run: python -m unittest discover -s tests -p 'test_spec_kit_decisions_board.py' -v
      - name: Codex skill discovery bridge tests
        run: python -m unittest discover -s tests -p 'test_spec_kit_codex_skill_bridge.py' -v
      - name: Traceability check
        run: python tools/spec_kit_six_file_validator.py examples/spec-kit-decisions-board

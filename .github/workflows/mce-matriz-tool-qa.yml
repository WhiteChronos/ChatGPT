name: MCE Matriz Causa Efeito Tool QA
on:
  pull_request:
    paths:
      - 'systems/mce/scripts/matriz_causa_efeito_tool.py'
      - 'systems/mce/tests/test_matriz_causa_efeito_tool.py'
      - 'systems/mce/datacenter/MATRIZ_CAUSA_EFEITO_DATASHEET.schema.json'
      - 'systems/mce/docs/MATRIZ_CAUSA_EFEITO_TOOL.md'
      - 'systems/mce/.agents/skills/matriz-causa-efeito/**'
      - '.agents/skills/matriz-causa-efeito/**'
      - 'systems/mce/scripts/verify_mce_skill_mirrors.py'
      - 'systems/mce/tests/test_windows_only_mce_tool.py'
      - '.github/workflows/mce-matriz-tool-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preanalysis-tool:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MCE test dependencies
        run: python -m pip install -r systems/mce/requirements.txt 'bandit==1.8.6'
      - name: Scan deterministic tool (no third-party execution)
        run: python -m bandit -q -ll systems/mce/scripts/matriz_causa_efeito_tool.py
      - name: Run real three-adapter synthetic integration and adversarial tests
        run: python -m pytest -q systems/mce/tests/test_matriz_causa_efeito_tool.py systems/mce/tests/test_pid_bridge.py systems/mce/tests/test_matriz_causa_efeito_skill.py
      - name: Validate four Skills and global mirrors
        run: |
          python systems/mce/scripts/validate_skills.py
          python systems/mce/scripts/verify_mce_skill_mirrors.py
      - name: Prevent Linux runner or runtime regressions
        run: python -m pytest -q systems/mce/tests/test_windows_only_mce_tool.py
      - name: Package Skill on Windows PowerShell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path 'systems/mce/.agents/skills/matriz-causa-efeito' -DestinationPath 'dist/skill.zip' -CompressionLevel Optimal
          python -c 'import zipfile; z=zipfile.ZipFile("dist/skill.zip"); assert "matriz-causa-efeito/SKILL.md" in z.namelist()'
      - name: Upload Windows Skill package
        uses: actions/upload-artifact@v4
        with:
          name: matriz-causa-efeito-windows-skill
          path: dist/skill.zip
          if-no-files-found: error
      - name: Package three backup helper Skills on native Windows
        run: |
          $names = @('mce-restic-backup', 'mce-kopia-backup', 'mce-watchdog-ingest')
          foreach ($name in $names) {
            $folder = "dist/$name"
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            Compress-Archive -Path "systems/mce/.agents/skills/$name" -DestinationPath "$folder/skill.zip" -CompressionLevel Optimal
            $env:MCE_SKILL_NAME = $name
            python -c 'import os, zipfile; s=os.environ["MCE_SKILL_NAME"]; z=zipfile.ZipFile(f"dist/{s}/skill.zip"); assert f"{s}/SKILL.md" in z.namelist() and f"{s}/agents/openai.yaml" in z.namelist()'
          }
      - name: Upload three Windows helper skill packages
        uses: actions/upload-artifact@v4
        with:
          name: mce-datacenter-helper-skills-windows
          path: |
            dist/mce-restic-backup/skill.zip
            dist/mce-kopia-backup/skill.zip
            dist/mce-watchdog-ingest/skill.zip
          if-no-files-found: error
      - name: Evidence boundary
        run: echo 'MCE pre-analysis synthetic gate only; no industrial source, engineering approval, Excel master editing or live Codex installation verified.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
name: Verify Awesome LLM Apps approved snapshot

on:
  push:
    branches:
      - feature/awesome-llm-apps-full-integration-v2
    paths:
      - ".github/workflows/verify-awesome-llm-apps-snapshot-temp.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WhiteChronos branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run complete Awesome integration regression suite
        run: |
          python -m pytest -q plugins/awesome-llm-apps-controller/tests
          bash plugins/awesome-llm-apps-controller/tests/test_sync_mirror.sh

      - name: Verify approved raw snapshot counts
        env:
          APPROVED_SHA: "4bf51ab704fb2c5b3803cd5191b30d7dcdb51dc2"
          UPSTREAM_URL: "https://github.com/Shubhamsaboo/awesome-llm-apps.git"
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git init -q "$TMP/upstream"
          git -C "$TMP/upstream" remote add origin "$UPSTREAM_URL"
          git -C "$TMP/upstream" fetch -q --depth 1 origin "$APPROVED_SHA"
          git -C "$TMP/upstream" checkout -q --detach FETCH_HEAD
          python - "$TMP/upstream" <<'PY'
          from pathlib import Path
          import subprocess, sys

          root=Path(sys.argv[1])
          expected={
              'tree_entries':2531,
              'blobs':1976,
              'skill_md':10,
              'readmes':223,
              'dependency_manifests':194,
              'env_examples':65,
              'dockerfiles':8,
              'mcp_related':139,
              'code_files':996,
          }
          tree=subprocess.check_output(
              ['git','-C',str(root),'ls-tree','-r','-t','HEAD'],
              text=True,
          ).splitlines()
          blob_lines=[line for line in tree if ' blob ' in line]
          paths=[line.split('\t',1)[1] for line in blob_lines]
          code_ext={'.py','.tsx','.ts','.js','.mjs','.sh','.jsx','.cjs'}

          def base(p): return Path(p).name
          def ext(p): return Path(p).suffix.lower()

          counts={
              'tree_entries':len(tree),
              'blobs':len(blob_lines),
              'skill_md':sum(base(p)=='SKILL.md' for p in paths),
              'readmes':sum(base(p).lower()=='readme.md' for p in paths),
              'dependency_manifests':sum(base(p) in {'requirements.txt','package.json','pyproject.toml'} for p in paths),
              'env_examples':sum(base(p) in {'.env.example','env.example'} for p in paths),
              'dockerfiles':sum(base(p)=='Dockerfile' for p in paths),
              'mcp_related':sum(
                  'mcp' in p.lower() and (ext(p) in code_ext or ext(p) in {'.md','.yaml','.yml'})
                  for p in paths
              ),
              'code_files':sum(ext(p) in code_ext for p in paths),
          }
          print('AUDITED_COUNTS='+repr(counts))
          assert counts==expected, (counts, expected)
          PY

      - name: Run real ingestion pipeline in isolated temporary host
        env:
          APPROVED_SHA: "4bf51ab704fb2c5b3803cd5191b30d7dcdb51dc2"
          UPSTREAM_URL: "https://github.com/Shubhamsaboo/awesome-llm-apps.git"
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          HOST="$TMP/host"
          mkdir -p "$HOST/registry/awesome-llm-apps" "$HOST/.agents/skills"
          cp registry/awesome-llm-apps/catalog.schema.json "$HOST/registry/awesome-llm-apps/catalog.schema.json"

          AWESOME_LLM_APPS_REPO_ROOT="$HOST"           AWESOME_LLM_APPS_UPSTREAM_URL="$UPSTREAM_URL"           AWESOME_LLM_APPS_UPSTREAM_REF="$APPROVED_SHA"           bash plugins/awesome-llm-apps-controller/scripts/sync_mirror.sh

          python - "$HOST" "$APPROVED_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          root=Path(sys.argv[1]); approved=sys.argv[2]
          lock=json.loads((root/'plugins/awesome-llm-apps-controller/upstream.lock.json').read_text())
          catalog=json.loads((root/'registry/awesome-llm-apps/catalog.json').read_text())
          summary=json.loads((root/'registry/awesome-llm-apps/catalog.summary.json').read_text())
          excluded=json.loads((root/'registry/awesome-llm-apps/.whitechronos-excluded.json').read_text())
          manifest=json.loads((root/'.agents/skills/.awesome-llm-apps-managed.json').read_text())

          canonical={
              'advisor-orchestrator-worker','commit-archaeologist','dependency-doctor',
              'first-reader','project-graveyard','scope-creep-detector','thinking-out-loud',
          }
          projected={item['name'] for item in manifest['skills']}
          assert projected==canonical, projected
          assert lock['upstream']['commit']==approved
          assert lock['upstream']['license']=='Apache-2.0'
          assert catalog['upstream_commit']==approved
          assert summary['total_entries']==len(catalog['entries'])
          assert not any(
              'generative_ui_agents/ai-mcp-app-builder' in item.get('upstream_path','')
              for item in manifest['skills']
          )

          external=[e for e in catalog['entries'] if e['source_type']=='external_reference']
          assert external, 'expected external-reference catalog entries'
          assert all(e['license_status']=='UNVERIFIED' for e in external)
          assert all(e['execution_class']=='REFERENCE_ONLY' for e in external)

          nested=[e for e in catalog['entries'] if e.get('license_status')=='VERIFIED_SUBPROJECT_LICENSE']
          assert nested, 'expected nested-license entries in real snapshot'
          for entry in nested:
              assert entry.get('license_paths')
              for p in entry['license_paths']:
                  assert (root/'vendor/shubhamsaboo-awesome-llm-apps'/p).exists(), p

          excluded_by_path={x['path']:x for x in excluded['excluded']}
          expected_large={
              'advanced_llm_apps/chat_with_X_tutorials/streaming_ai_chatbot/docs/images/streaming-ai-chatbot.gif',
              'advanced_llm_apps/thinkpath_chatbot_app/github thinkpath video.mp4',
          }
          assert expected_large <= excluded_by_path.keys()
          for p in expected_large:
              assert excluded_by_path[p]['reason']=='large_demo_media'
              assert excluded_by_path[p]['git_sha']
              assert not (root/'vendor/shubhamsaboo-awesome-llm-apps'/p).exists()

          print('CATALOG_ENTRIES',len(catalog['entries']))
          print('EXTERNAL_REFERENCES',len(external))
          print('NESTED_LICENSE_ENTRIES',len(nested))
          print('PROJECTED_SKILLS',len(projected))
          print('EXCLUDED_FILES',len(excluded['excluded']))
          PY

      - name: Assess current-main drift
        env:
          APPROVED_SHA: "4bf51ab704fb2c5b3803cd5191b30d7dcdb51dc2"
          UPSTREAM_URL: "https://github.com/Shubhamsaboo/awesome-llm-apps.git"
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote "$UPSTREAM_URL" refs/heads/main | awk '{print $1}')"
          echo "APPROVED_SHA=$APPROVED_SHA"
          echo "CURRENT_MAIN_SHA=$CURRENT_SHA"
          if [[ "$CURRENT_SHA" == "$APPROVED_SHA" ]]; then
            echo "DRIFT=none"
          else
            echo "DRIFT=present"
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            git clone -q --depth 1 --branch main "$UPSTREAM_URL" "$TMP/current"
            grep -q 'Apache License' "$TMP/current/LICENSE"
            grep -q 'Version 2.0' "$TMP/current/LICENSE"
            python - "$TMP/current" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          registry=json.loads((root/'agent_skills/registry.json').read_text())
          assert registry.get('skills'), 'canonical registry disappeared'
          required={
              'starter_ai_agents','advanced_ai_agents','always_on_agents','voice_ai_agents',
              'mcp_ai_agents','generative_ui_agents','rag_tutorials','advanced_llm_apps',
              'ai_agent_framework_crash_course','agent_skills',
          }
          missing=sorted(name for name in required if not (root/name).is_dir())
          assert not missing, f'required roots removed: {missing}'
          print('CURRENT_CANONICAL_SKILLS',len(registry['skills']))
          PY
          fi

name: MCE GitHub canonical memory
on:
  pull_request:
    paths:
      - 'systems/mce/**'
      - '.agents/skills/padronizacao-mce/**'
      - '.agents/skills/engenharia-mce-projeto/**'
      - '.agents/skills/mce-fechamento-operacional/**'
      - '.github/workflows/mce-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit canonical GitHub memory
        run: python systems/mce/scripts/github_memory_gate.py --repo-root .
      - name: Regression against missing or rewritten decisions
        run: |
          python -m pip install pytest
          python -m pytest -q systems/mce/tests/test_github_memory_gate.py

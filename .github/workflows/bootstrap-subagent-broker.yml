name: Recover staged Subagent Broker sources

on:
  workflow_dispatch:
  push:
    branches:
      - feature/subagent-broker-runtime
    paths:
      - ".bootstrap/subagent-broker/**"
      - ".github/workflows/bootstrap-subagent-broker.yml"

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover complete members from truncated transport
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/subagent-broker/chunk-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/subagent-broker.tar.gz
          sha256sum /tmp/subagent-broker.tar.gz
          set +e
          tar -xzf /tmp/subagent-broker.tar.gz
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            echo "::warning::Transport unexpectedly became complete; continuing with verified recovered members."
          else
            echo "::warning::Expected truncated transport detected; only pre-truncation members will be retained."
          fi

          required=(
            ".github/workflows/subagent-broker.yml"
            ".gitignore"
            "plugins/subagent-broker/.mcp.json"
            "plugins/subagent-broker/.codex-plugin/plugin.json"
            "plugins/subagent-broker/README.md"
            "plugins/subagent-broker/skills/subagent-broker/SKILL.md"
            "plugins/subagent-broker/skills/subagent-broker/agents/openai.yaml"
            "plugins/subagent-broker/skills/subagent-broker/references/routing.md"
            "plugins/subagent-broker/skills/subagent-broker/references/lifecycle.md"
            "plugins/subagent-broker/skills/subagent-broker/references/security.md"
            "plugins/subagent-broker/skills/subagent-broker/references/superpowers-sdd.md"
            "plugins/subagent-broker/scripts/smoke_real_codex.mjs"
            "plugins/subagent-broker/mcp-server/broker.mjs"
            "plugins/subagent-broker/mcp-server/redaction.mjs"
            "plugins/subagent-broker/mcp-server/worktree_manager.mjs"
          )
          for p in "${required[@]}"; do
            [[ -s "$p" ]] || { echo "missing recovered member: $p" >&2; exit 1; }
          done

          node --check plugins/subagent-broker/mcp-server/broker.mjs
          node --check plugins/subagent-broker/mcp-server/redaction.mjs
          node --check plugins/subagent-broker/mcp-server/worktree_manager.mjs
          node --check plugins/subagent-broker/scripts/smoke_real_codex.mjs

      - name: Commit recovered sources and remove transport
        shell: bash
        run: |
          set -euo pipefail
          # state_store.mjs is the truncation boundary; do not keep a partial copy.
          rm -f plugins/subagent-broker/mcp-server/state_store.mjs
          # Workflow mutation is intentionally excluded: Actions tokens in this
          # repository cannot create/update workflow files. The GitHub connector
          # installs the final workflow and removes this bootstrap afterward.
          rm -f .github/workflows/subagent-broker.yml
          rm -rf .bootstrap/subagent-broker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: recover verified Subagent Broker sources"
          git push origin HEAD:feature/subagent-broker-runtime

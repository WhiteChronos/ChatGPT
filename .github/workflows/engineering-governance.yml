name: Engineering Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Compile validator
        run: python -m py_compile pipeline/validate_engineering.py

      - name: Run regression tests
        run: pytest -q

      - name: Verify golden rule file exists
        run: test -f governance/REGRA_DE_OURO.md

      - name: Verify memory policy exists
        run: test -f memory/MEMORY_POLICY.md

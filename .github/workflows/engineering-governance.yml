name: Engineering Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify CI environment contract
        run: |
          test "$PYTHONPATH" = "$GITHUB_WORKSPACE"
          python -c "import pipeline.validate_engineering; import pipeline.agents_v4_4"

      - name: Compile Python sources
        run: python -m compileall -q pipeline tests

      - name: Run CI contract regression test
        run: python -m pytest -q tests/test_ci_workflow_contract.py

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Verify governance assets
        run: |
          test -f governance/REGRA_DE_OURO.md
          test -f governance/PROMPT_MESTRE_AUTOMACAO_v4_4.md
          test -f memory/MEMORY_POLICY.md
          test -f memory/LESSON_CI_PYTHONPATH_2026-08-24.md
          test -f memory/LESSON_CI_EXPRESSION_INTERPOLATION_2026-08-24.md
          test -f schemas/governance_v4_4.schema.json

      - name: Enforce v4.4 golden constants
        run: |
          grep -q "12 mm" governance/PROMPT_MESTRE_AUTOMACAO_v4_4.md
          grep -q "CMD, RUN, FAULT" governance/PROMPT_MESTRE_AUTOMACAO_v4_4.md
          grep -q '"external_mm": {"const": 12}' schemas/governance_v4_4.schema.json
          grep -q '"aspect_ratio": {"const": 1}' schemas/governance_v4_4.schema.json

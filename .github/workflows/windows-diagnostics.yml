name: Windows Diagnostics Hub
on:
  pull_request:
    paths:
      - 'systems/windows-diagnostics/**'
      - '.agents/skills/windows-diagnostics-hub/**'
      - '.github/workflows/windows-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'systems/windows-diagnostics/**'
      - '.agents/skills/windows-diagnostics-hub/**'
      - '.github/workflows/windows-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hub:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate public catalogue
        run: node systems/windows-diagnostics/scripts/hub.mjs validate
      - name: Test controller and refusal of execution commands
        run: node --test systems/windows-diagnostics/tests/hub.test.mjs
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing repository test dependencies on runner
        run: python -m pip install -r requirements-dev.txt
      - run: python pipeline/engineering_compatibility_gate.py
      - run: python pipeline/protocol_zero_gate.py datasheet/projects/example-project.json
      - run: python -m pytest -q tests/test_engineering_compatibility_gate.py tests/test_protocol_zero_gate.py

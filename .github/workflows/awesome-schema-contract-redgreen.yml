name: Awesome Schema Contract RED-GREEN

on:
  push:
    branches: ["fix/awesome-schema-contract"]
    paths:
      - "registry/awesome-llm-apps/catalog.schema.json"
      - "plugins/awesome-llm-apps-controller/scripts/build_catalog.py"
      - "plugins/awesome-llm-apps-controller/tests/test_catalog.py"
      - ".github/workflows/awesome-schema-contract-redgreen.yml"
  pull_request:
    branches: [main]
    paths:
      - "registry/awesome-llm-apps/catalog.schema.json"
      - "plugins/awesome-llm-apps-controller/scripts/build_catalog.py"
      - "plugins/awesome-llm-apps-controller/tests/test_catalog.py"
      - ".github/workflows/awesome-schema-contract-redgreen.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Catalog schema contract
        run: python -m pytest -q plugins/awesome-llm-apps-controller/tests/test_catalog.py
      - name: Repository governance gates
        run: |
          python pipeline/engineering_compatibility_gate.py
          python pipeline/protocol_zero_gate.py datasheet/projects/example-project.json
          python -m pytest -q tests/test_engineering_compatibility_gate.py
          python -m pytest -q tests/test_protocol_zero_gate.py

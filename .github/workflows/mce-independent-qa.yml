name: MCE independent system QA
on:
  pull_request:
    paths:
      - 'systems/mce/**'
      - '.agents/skills/padronizacao-mce/**'
      - '.agents/skills/engenharia-mce-projeto/**'
      - '.agents/skills/mce-fechamento-operacional/**'
      - '.agents/skills/matriz-causa-efeito/**'
      - '.github/workflows/mce-independent-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mce-regression:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            systems/mce
            .agents/skills
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r systems/mce/requirements.txt
      - run: python systems/mce/scripts/validate_skills.py
      - name: Verify all MCE mirrors with Python
        run: python systems/mce/scripts/verify_mce_skill_mirrors.py
      - run: python -m pytest -q systems/mce/tests

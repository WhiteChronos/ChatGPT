name: Verify Awesome LLM Apps approved snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - feature/awesome-llm-apps-resumed
    paths:
      - "plugins/awesome-llm-apps-controller/**"
      - "registry/awesome-llm-apps/catalog.schema.json"
      - ".github/workflows/verify-awesome-snapshot.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Native unit and fake-sync suite
        run: |
          python -m pytest -q plugins/awesome-llm-apps-controller/tests
          bash plugins/awesome-llm-apps-controller/tests/test_sync_mirror.sh
      - name: Ingest approved upstream snapshot in isolation
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_ROOT="$(mktemp -d)"
          mkdir -p "$VERIFY_ROOT/plugins/awesome-llm-apps-controller/scripts"                    "$VERIFY_ROOT/registry/awesome-llm-apps"                    "$VERIFY_ROOT/.agents/skills"
          find plugins/awesome-llm-apps-controller/scripts -maxdepth 1 -type f -exec cp {} "$VERIFY_ROOT/plugins/awesome-llm-apps-controller/scripts/" \;
          cp registry/awesome-llm-apps/catalog.schema.json "$VERIFY_ROOT/registry/awesome-llm-apps/"
          AWESOME_LLM_APPS_REPO_ROOT="$VERIFY_ROOT"           AWESOME_LLM_APPS_UPSTREAM_URL="https://github.com/Shubhamsaboo/awesome-llm-apps.git"           AWESOME_LLM_APPS_UPSTREAM_REF="4bf51ab704fb2c5b3803cd5191b30d7dcdb51dc2"             bash plugins/awesome-llm-apps-controller/scripts/sync_mirror.sh

          python - "$VERIFY_ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          lock=json.loads((root/'plugins/awesome-llm-apps-controller/upstream.lock.json').read_text())
          expected={
            'tree_entries':2531,
            'blobs':1976,
            'skill_md':10,
            'canonical_skills':7,
            'readmes':223,
            'dependency_manifests':194,
            'env_examples':65,
            'dockerfiles':8,
            'compose_files':1,
            'mcp_related':139,
            'code_files':996,
          }
          assert lock['commit']=='4bf51ab704fb2c5b3803cd5191b30d7dcdb51dc2', lock['commit']
          assert lock['ref']=='4bf51ab704fb2c5b3803cd5191b30d7dcdb51dc2', lock['ref']
          assert lock['license']=='Apache-2.0'
          assert lock['snapshot_statistics']==expected, (lock['snapshot_statistics'], expected)
          assert lock['canonical_skill_count']==7
          assert sorted(lock['canonical_skills'])==sorted([
            'advisor-orchestrator-worker','commit-archaeologist','dependency-doctor',
            'first-reader','project-graveyard','scope-creep-detector','thinking-out-loud'
          ])
          assert any(x.get('name')=='first-reader' and x.get('kind')=='license_metadata'
                     and x.get('detail')=='empty_or_missing'
                     for x in lock.get('inconsistencies',[])), lock.get('inconsistencies')

          managed=json.loads((root/'.agents/skills/.awesome-llm-apps-managed.json').read_text())
          names=sorted(x['name'] if isinstance(x,dict) else x for x in managed['managed_skills'])
          assert len(names)==7, names

          catalog=json.loads((root/'registry/awesome-llm-apps/catalog.json').read_text())
          entries=catalog['entries']
          assert sum(e['subtype']=='canonical_skill' for e in entries)==7
          assert sum(e['subtype']=='project_internal_skill' for e in entries)==3
          self_improving=[e for e in entries if e.get('upstream_path')=='agent_skills/self-improving-agent-skills']
          assert self_improving and all(e['subtype']!='canonical_skill' for e in self_improving)
          assert sum(e['source_type']=='external_reference' for e in entries)>=2

          excluded=json.loads((root/'vendor/shubhamsaboo-awesome-llm-apps/.whitechronos-excluded.json').read_text())
          assert sum(x['reason']=='large_demo_media' for x in excluded['excluded'])>=2
          assert (root/'vendor/shubhamsaboo-awesome-llm-apps/LICENSE').exists()
          print('APPROVED SNAPSHOT PASS')
          print(json.dumps({
            'snapshot_statistics':lock['snapshot_statistics'],
            'catalog_entries':len(entries),
            'catalog_by_source_type':lock['catalog_by_source_type'],
            'included_files':lock['included_files'],
            'included_bytes':lock['included_bytes'],
            'excluded_files':lock['excluded_files'],
            'excluded_bytes':lock['excluded_bytes'],
            'external_references':sum(e['source_type']=='external_reference' for e in entries),
            'project_internal_skills':sum(e['subtype']=='project_internal_skill' for e in entries),
          }, indent=2))
          PY

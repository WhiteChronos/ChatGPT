name: DEKS Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'pipeline/build_deks_docs.py'
      - 'pipeline/build_interactive_glossary.py'
      - 'pipeline/build_public_glossary.py'
      - 'pipeline/deks_engine.py'
      - 'pipeline/glossary_engine.py'
      - 'pipeline/knowledge_ingestion.py'
      - 'datacenter/**'
      - 'ingestion/**'
      - 'mkdocs.yml'
      - 'requirements-dev.txt'
      - '.github/workflows/deks-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deks-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Validate glossary datacenter
        run: python pipeline/glossary_engine.py

      - name: Validate DEKS
        run: python pipeline/deks_engine.py

      - name: Validate Knowledge Ingestion
        run: python pipeline/knowledge_ingestion.py --validate-registry

      - name: Generate DEKS documentation
        run: python pipeline/build_deks_docs.py

      - name: Generate interactive glossary
        run: python pipeline/build_interactive_glossary.py

      - name: Generate stable public glossary route
        run: python pipeline/build_public_glossary.py

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Verify public glossary output
        run: |
          test -f docs/glossario-interativo.md
          test -f site/glossario-interativo/index.html
          grep -q 'BASE APROVADA' docs/glossario-interativo.md
          grep -q 'STAGING — NÃO APROVADO' docs/glossario-interativo.md

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

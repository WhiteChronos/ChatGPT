name: MCE complete release candidate
on:
  pull_request:
    paths:
      - 'systems/mce/**'
      - '.agents/skills/**'
      - '.github/workflows/mce-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-candidate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r systems/mce/requirements-web.txt
      - run: python systems/mce/scripts/validate_skills.py
      - run: python systems/mce/scripts/verify_mce_skill_mirrors.py
      - run: python systems/mce/scripts/github_memory_gate.py
      - run: python -m pytest -q systems/mce/tests
      - name: Package exact committed public code and verify existing release contract
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $commit = git rev-parse HEAD
          python systems/mce/scripts/build_release.py --repo . --expected-commit $commit --output dist/MCE_INDEPENDENTE.zip | Out-File dist/build-report.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash dist/MCE_INDEPENDENTE.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  MCE_INDEPENDENTE.zip" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          python systems/mce/scripts/release_integrity.py --zip dist/MCE_INDEPENDENTE.zip --expected-sha256 $digest --expected-git-sha $commit | Out-File dist/integrity-report.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Candidate only: commit=$commit SHA256=$digest. No installation, project data, engineering approval or production release." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: mce-complete-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error

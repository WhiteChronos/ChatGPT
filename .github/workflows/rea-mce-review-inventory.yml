name: REA MCE evidence inventory (NOT approval)
on:
  pull_request:
    paths:
      - '.github/agents/rea-mce-pr-reviewer.agent.md'
      - '.github/workflows/rea-mce-review-inventory.yml'
      - 'scripts/rea_mce_review_inventory.py'
      - 'tests/test_rea_mce_review_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  evidence-inventory:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adversarial tests of inventory logic
        run: python -m unittest discover -s tests -p test_rea_mce_review_inventory.py -v
      - name: Read live evidence on both product PRs; never submit review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/rea_mce_review_inventory.py --repo WhiteChronos/ChatGPT --pr 118 119

name: MCE full product security evidence
on:
  pull_request:
    paths: ['systems/mce/**', '.agents/skills/engenharia-mce-projeto/**', '.agents/skills/padronizacao-mce/**', '.agents/skills/mce-fechamento-operacional/**', '.agents/skills/matriz-causa-efeito/**', '.github/workflows/mce-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r systems/mce/requirements.txt 'bandit==1.8.6'
      - name: Scan MCE operational code and all canonical skill scripts
        run: python -m bandit -ll -r systems/mce/scripts systems/mce/.agents/skills --exclude systems/mce/.agents/skills/mce-fechamento-operacional/tests
      - name: Security, workbook and evidence regression
        run: python -m pytest -q systems/mce/tests
      - name: Verify four canonical skills
        run: python systems/mce/scripts/validate_skills.py
      - name: Evidence boundary
        run: echo 'Full MCE product Python scope and regression passed; no real template or engineering approval is inferred.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

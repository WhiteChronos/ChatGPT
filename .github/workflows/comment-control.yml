name: Comment Control Intelligence

on:
  push:
    branches: [main, feature/comment-control-intelligence]
    paths:
      - 'pipeline/comment_control_*.py'
      - 'tests/test_comment_control*.py'
      - 'schemas/comment_control_v1.schema.json'
      - 'datasheet/COMMENT_CONTROL_DATA_SHEET.json'
      - 'datacenter/comment_control_schema.sql'
      - 'datacenter/migrations/*.sql'
      - 'governance/COMMENT_CONTROL_STANDARD_v1_0.md'
      - 'governance/PROMPT_MESTRE_CONTROLE_COMENTARIOS_v1_0.md'
      - 'docs/comment-control-agent-prompt.md'
      - 'memory/LESSON_CLARIFICATION_BEFORE_ARTIFACT_2026-09-09.md'
      - '.github/workflows/comment-control.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-comment-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.4.1 jsonschema==4.25.1 openpyxl==3.1.5 'pydantic>=2.8,<3'
          python -m pip check

      - name: Compile sources
        run: python -m compileall -q pipeline tests

      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('schemas/comment_control_v1.schema.json'),
              Path('datasheet/COMMENT_CONTROL_DATA_SHEET.json'),
          ]:
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY

      - name: Run deterministic regression tests
        run: python -m pytest -q tests/test_comment_control.py

      - name: Verify governance invariants
        run: |
          grep -q 'BLOCK_ON_ANY_FAILURE' governance/COMMENT_CONTROL_STANDARD_v1_0.md
          grep -q 'WAITING_CLARIFICATION' governance/COMMENT_CONTROL_STANDARD_v1_0.md
          grep -q 'preflight_payload.json' governance/COMMENT_CONTROL_STANDARD_v1_0.md
          grep -q 'questions_never_exported' datasheet/COMMENT_CONTROL_DATA_SHEET.json
          grep -q 'resolved_question_requires_resolution_text' datasheet/COMMENT_CONTROL_DATA_SHEET.json
          grep -q 'unresolved_question_blocks_generation' datasheet/COMMENT_CONTROL_DATA_SHEET.json
          grep -q 'CC-CLARIFICATION-OPEN' pipeline/comment_control_pipeline.py
          grep -q 'CC-CLARIFICATION-RESOLUTION' pipeline/comment_control_pipeline.py
          grep -q 'apply_clarification_resolutions' pipeline/comment_control_clarification.py
          grep -q 'clarification_questions' pipeline/comment_control_agent.py
          grep -q 'checkbox_font_size_pt' datasheet/COMMENT_CONTROL_DATA_SHEET.json
          grep -q 'Gate obrigatório de dúvida antes da elaboração' docs/comment-control-agent-prompt.md
          grep -q 'enforce_clarification_resolution_integrity' datacenter/migrations/20260909_clarification_resolution_integrity.sql

      - name: Agent import smoke test
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install 'openai-agents>=0.2,<1' 'pydantic>=2.8,<3'
          python -c "from pipeline.comment_control_agent import build_agent; print(build_agent().name)"

  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: comment_control
          POSTGRES_PASSWORD: comment_control
          POSTGRES_DB: comment_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comment_control -d comment_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      TEST_DATABASE_URL: postgresql://comment_control:comment_control@localhost:5432/comment_control

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install database test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.4.1 'psycopg[binary]>=3.2,<4'
          python -m pip check

      - name: Run PostgreSQL contract tests
        run: python -m pytest -q tests/test_comment_control_db.py

name: Engineering Compatibility Visualize Gate

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/OPEN_SOURCE_AND_PLUGIN_CATALOG.md'
      - 'docs/FONT_FIDELITY_SETUP.md'
      - 'governance/VISUALIZE_GOLDEN_RULE_v1_0.md'
      - 'governance/AUTOMATION_HYPERFOCUS_GOLDEN_RULE_v1_0.md'
      - 'governance/AUTOMATION_COMPATIBILITY_REPORT_MODEL_v1_0.md'
      - 'governance/AUTOMATION_COMPACT_EXCEL_EXPORT_MODEL_v1_0.md'
      - 'governance/AUTOMATION_ELABORATION_EXECUTION_CONTROL_GOLDEN_RULE_v1_0.md'
      - 'governance/DOCUMENT_FIDELITY_INTERPRETATION_GOLDEN_RULE_v1_0.md'
      - 'governance/AUTOMATION_EVIDENCE_RESEARCH_GOLDEN_RULE_v1_0.md'
      - 'governance/ENGINEERING_COMPATIBILITY_HARDENING_v1_1.md'
      - 'schemas/engineering_compatibility.schema.json'
      - 'datacenter/ENGINEERING_COMPATIBILITY_CONFIG.json'
      - 'datacenter/AUTOMATION_REFERENCE_LIBRARY.json'
      - 'datacenter/AUTOMATION_COMPATIBILITY_REPORT_MODEL.json'
      - 'datacenter/AUTOMATION_REPORT_EXPORT_PROFILES.json'
      - 'datacenter/AUTOMATION_ELABORATION_EXECUTION_CONTROL.json'
      - 'datacenter/DOCUMENT_FIDELITY_INTERPRETATION_MODEL.json'
      - 'datacenter/DOCUMENT_FONT_FIDELITY_MANIFEST.json'
      - 'datacenter/AUTOMATION_TECHNICAL_KNOWLEDGE_BASE.json'
      - 'datasheet/ENGINEERING_COMPATIBILITY_DATA_SHEET.json'
      - 'datasheet/projects/**/*.json'
      - 'pipeline/engineering_compatibility*.py'
      - 'pipeline/protocol_zero_gate.py'
      - 'pipeline/document_fidelity_probe.py'
      - 'pipeline/font_fidelity_gate.py'
      - 'pipeline/with_private_fonts.sh'
      - 'tests/test_engineering_compatibility_gate.py'
      - 'tests/test_protocol_zero_gate.py'
      - 'tests/test_automation_report_model.py'
      - 'tests/test_document_fidelity_probe.py'
      - 'tests/test_font_fidelity_gate.py'
      - 'tests/test_engineering_compatibility_gate_codex_round4.py'
      - 'tests/test_engineering_compatibility_gate_codex_round5.py'
      - 'tests/test_engineering_compatibility_gate_codex_round6.py'
      - 'tests/test_engineering_compatibility_gate_codex_round7.py'
      - 'tests/test_engineering_compatibility_gate_codex_round8.py'
      - 'tests/test_engineering_compatibility_gate_codex_round9.py'
      - '.github/workflows/engineering-compatibility-visualize.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/OPEN_SOURCE_AND_PLUGIN_CATALOG.md'
      - 'docs/FONT_FIDELITY_SETUP.md'
      - 'governance/VISUALIZE_GOLDEN_RULE_v1_0.md'
      - 'governance/AUTOMATION_HYPERFOCUS_GOLDEN_RULE_v1_0.md'
      - 'governance/ENGINEERING_COMPATIBILITY_HARDENING_v1_1.md'
      - 'schemas/engineering_compatibility.schema.json'
      - 'datacenter/ENGINEERING_COMPATIBILITY_CONFIG.json'
      - 'datasheet/ENGINEERING_COMPATIBILITY_DATA_SHEET.json'
      - 'datasheet/projects/**/*.json'
      - 'pipeline/engineering_compatibility*.py'
      - 'pipeline/protocol_zero_gate.py'
      - 'pipeline/document_fidelity_probe.py'
      - 'pipeline/font_fidelity_gate.py'
      - 'pipeline/with_private_fonts.sh'
      - 'tests/test_engineering_compatibility_gate.py'
      - 'tests/test_protocol_zero_gate.py'
      - 'tests/test_engineering_compatibility_gate_codex_round4.py'
      - 'tests/test_engineering_compatibility_gate_codex_round5.py'
      - 'tests/test_engineering_compatibility_gate_codex_round6.py'
      - 'tests/test_engineering_compatibility_gate_codex_round7.py'
      - 'tests/test_engineering_compatibility_gate_codex_round8.py'
      - 'tests/test_engineering_compatibility_gate_codex_round9.py'
      - '.github/workflows/engineering-compatibility-visualize.yml'

jobs:
  golden-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile compatibility validators
        run: |
          python -m py_compile pipeline/engineering_compatibility_gate.py
          python -m py_compile pipeline/engineering_compatibility_gate_impl.py
          python -m py_compile pipeline/engineering_compatibility.py
          python -m py_compile pipeline/protocol_zero_gate.py
          python -m py_compile pipeline/document_fidelity_probe.py
          python -m py_compile pipeline/font_fidelity_gate.py

      - name: Validate JSON syntax
        run: |
          python -m json.tool datacenter/ENGINEERING_COMPATIBILITY_CONFIG.json >/dev/null
          python -m json.tool datacenter/AUTOMATION_REFERENCE_LIBRARY.json >/dev/null
          python -m json.tool datacenter/AUTOMATION_COMPATIBILITY_REPORT_MODEL.json >/dev/null
          python -m json.tool datacenter/AUTOMATION_REPORT_EXPORT_PROFILES.json >/dev/null
          python -m json.tool datacenter/AUTOMATION_ELABORATION_EXECUTION_CONTROL.json >/dev/null
          python -m json.tool datacenter/DOCUMENT_FIDELITY_INTERPRETATION_MODEL.json >/dev/null
          python -m json.tool datacenter/DOCUMENT_FONT_FIDELITY_MANIFEST.json >/dev/null
          python -m json.tool datacenter/AUTOMATION_TECHNICAL_KNOWLEDGE_BASE.json >/dev/null
          python -m json.tool schemas/engineering_compatibility.schema.json >/dev/null
          python -m json.tool datasheet/ENGINEERING_COMPATIBILITY_DATA_SHEET.json >/dev/null
          python -m json.tool datasheet/projects/example-project.json >/dev/null

      - name: Validate datasheet template against schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.load(open('schemas/engineering_compatibility.schema.json', encoding='utf-8'))
          data=json.load(open('datasheet/ENGINEERING_COMPATIBILITY_DATA_SHEET.json', encoding='utf-8'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)
          print('Template schema: PASS')
          PY

      - name: Exercise permanent positive semantic gate
        run: python pipeline/engineering_compatibility_gate.py

      - name: Exercise Protocol Zero semantic gate
        run: python pipeline/protocol_zero_gate.py datasheet/projects/example-project.json

      - name: Exercise compatibility report wrapper
        run: |
          python pipeline/engineering_compatibility.py \
            datasheet/projects/example-project.json \
            --summary /tmp/example-compatibility-summary.json
          python - <<'PY'
          import json
          summary=json.load(open('/tmp/example-compatibility-summary.json', encoding='utf-8'))
          assert summary['release_gate'] == 'PASS', summary
          assert summary['validation_error_count'] == 0, summary
          print('Wrapper summary: PASS')
          PY

      - name: Permanent Golden Rule regression tests
        run: |
          pytest -q tests/test_engineering_compatibility_gate.py
          pytest -q tests/test_protocol_zero_gate.py
          pytest -q tests/test_automation_report_model.py
          pytest -q tests/test_document_fidelity_probe.py
          pytest -q tests/test_font_fidelity_gate.py
          pytest -q tests/test_engineering_compatibility_gate_codex_round4.py
          pytest -q tests/test_engineering_compatibility_gate_codex_round5.py
          pytest -q tests/test_engineering_compatibility_gate_codex_round6.py
          pytest -q tests/test_engineering_compatibility_gate_codex_round7.py
          pytest -q tests/test_engineering_compatibility_gate_codex_round8.py
          pytest -q tests/test_engineering_compatibility_gate_codex_round9.py

      - name: Enforce Golden Rule on project datasheets
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(datasheet/projects/**/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No project compatibility datasheets found; semantic gate skipped.'
            exit 0
          fi
          rc=0
          for file in "${files[@]}"; do
            echo "Validating $file"
            python pipeline/engineering_compatibility_gate.py "$file" || rc=1
          done
          exit $rc

      - name: Verify Codex compatibility contract exists
        run: |
          grep -q 'VISUALIZE_GOLDEN_RULE_v1_0' AGENTS.md
          grep -q 'engineering_compatibility_gate.py' AGENTS.md
          grep -q 'complete_not_summary' governance/VISUALIZE_GOLDEN_RULE_v1_0.md
          grep -q 'QUESTION_BEFORE_FINDING' governance/AUTOMATION_HYPERFOCUS_GOLDEN_RULE_v1_0.md
          grep -q 'protocol_zero_gate.py' AGENTS.md
          grep -q 'AUTOMATION_COMPATIBILITY_REPORT_MODEL_v1_0' AGENTS.md
          grep -q 'AUTOMATION_COMPATIBILITY_REPORT_MODEL_V1_0' datacenter/AUTOMATION_COMPATIBILITY_REPORT_MODEL.json
          grep -q 'AUTOMATION_COMPACT_XLSX_V1' datacenter/AUTOMATION_REPORT_EXPORT_PROFILES.json
          grep -q 'AUTOMATION_ELABORATION_EXECUTION_CONTROL_V1_0' datacenter/AUTOMATION_ELABORATION_EXECUTION_CONTROL.json
          grep -q 'DOCUMENT_FIDELITY_INTERPRETATION_V1_0' datacenter/DOCUMENT_FIDELITY_INTERPRETATION_MODEL.json
          grep -q 'DOCUMENT_FONT_FIDELITY_MANIFEST_V1_0' datacenter/DOCUMENT_FONT_FIDELITY_MANIFEST.json
          grep -q 'Petrobras Sans' datacenter/DOCUMENT_FONT_FIDELITY_MANIFEST.json
          grep -q 'proprietary_font_binaries_must_not_be_committed' datacenter/DOCUMENT_FONT_FIDELITY_MANIFEST.json
          grep -q 'RENDER_MISMATCH' governance/DOCUMENT_FIDELITY_INTERPRETATION_GOLDEN_RULE_v1_0.md
          grep -q 'IEC 62443' governance/AUTOMATION_ELABORATION_EXECUTION_CONTROL_GOLDEN_RULE_v1_0.md
          grep -q 'Findings are consolidated into the Documents & Actions sheet' governance/AUTOMATION_COMPACT_EXCEL_EXPORT_MODEL_v1_0.md
          grep -q 'PETROBRAS-N-1882' datacenter/AUTOMATION_REFERENCE_LIBRARY.json
          grep -q 'PETROBRAS-N-1883' datacenter/AUTOMATION_REFERENCE_LIBRARY.json
          grep -q 'PETROBRAS-N-2833' datacenter/AUTOMATION_REFERENCE_LIBRARY.json
          grep -q 'AUTOMATION_EVIDENCE_RESEARCH_GOLDEN_RULE_v1_0' AGENTS.md
          grep -q 'Do not derive relay count from DO count' datacenter/AUTOMATION_TECHNICAL_KNOWLEDGE_BASE.json
          grep -q 'ENGINEERING_COMPATIBILITY_VISUALIZE_V1_1' datacenter/ENGINEERING_COMPATIBILITY_CONFIG.json

name: Continuous Skill Audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/skill_governance_audit.py'
      - 'tests/test_skill_governance_audit.py'
      - '.github/workflows/continuous-skill-audit.yml'
      - '**/SKILL.md'
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_skill_governance_audit.py' -v
      - name: Audit skill entrypoints
        run: python tools/skill_governance_audit.py --root . --output skill-audit.json
      - name: Upload findings even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-audit
          path: skill-audit.json
          if-no-files-found: warn
          retention-days: 30

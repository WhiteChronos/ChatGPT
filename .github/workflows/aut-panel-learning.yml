name: AUT Panel Learning Control

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/**'
      - 'database/**'
      - 'ml/**'
      - 'memory/agents/**'
      - 'plugins/aut_panel_open_source_registry.json'
      - 'pipeline/aut_panel_db.py'
      - 'pipeline/aut_panel_learning.py'
      - 'pipeline/evolution_engine.py'
      - 'pipeline/learning_pipeline.yaml'
      - 'skills/aut-panel-engineering/**'
      - 'tests/test_aut_panel_agent_system.py'
      - 'requirements-ml.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile governed agent modules
        run: python -m compileall -q pipeline tests
      - name: Run agent-system tests
        run: python -m pytest -q tests/test_aut_panel_agent_system.py tests/test_layout_optimizer_*.py
      - name: Initialize database
        run: |
          rm -rf build/aut-panel-learning
          mkdir -p build/aut-panel-learning
          python pipeline/aut_panel_db.py --db build/aut-panel-learning/aut_panel.sqlite3 init
          python pipeline/aut_panel_db.py --db build/aut-panel-learning/aut_panel.sqlite3 status
      - name: Verify cold-start learning behavior
        run: |
          printf '%s\n' '{"features":{"quantity_mismatch":0.0},"label":"accepted","reviewed_by_human":true}' > build/aut-panel-learning/train.jsonl
          python pipeline/aut_panel_learning.py build/aut-panel-learning/train.jsonl | tee build/aut-panel-learning/learning.json
          grep -q 'LEARNING_COLD_START' build/aut-panel-learning/learning.json
      - name: Verify controlled evolution proposal
        run: |
          cat > build/aut-panel-learning/proposal_input.json <<'JSON'
          {"problem":"test","affected_files":["governance/golden_rules.yaml"],"candidate_change":{"type":"test"},"tests":["pytest"]}
          JSON
          python pipeline/evolution_engine.py build/aut-panel-learning/proposal_input.json --output build/aut-panel-learning/proposal.json
          python - <<'PY'
          import json
          p=json.load(open('build/aut-panel-learning/proposal.json'))
          assert p['requires_human_approval'] is True
          assert p['auto_apply_allowed'] is False
          PY

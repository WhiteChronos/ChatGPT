name: Bootstrap Awesome LLM Apps Native implementation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/awesome-llm-apps-resumed
    paths:
      - ".bootstrap/awesome/**"
      - ".github/workflows/bootstrap-awesome-llm-apps.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reconstruct and validate source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/awesome/chunk-*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/awesome-infra.tar.gz
          echo "56d1f87bdb56980bdd02ecc3fe79371d861c0105bde503a3fd2f72b36d581ce4  /tmp/awesome-infra.tar.gz" | sha256sum -c -
          python - <<'PY'
          import pathlib, tarfile
          archive="/tmp/awesome-infra.tar.gz"
          allowed_exact={"registry/awesome-llm-apps/catalog.schema.json"}
          allowed_prefixes=("plugins/awesome-llm-apps-controller/",)
          with tarfile.open(archive,"r:gz") as tf:
              members=tf.getmembers()
              if not members:
                  raise SystemExit("empty bundle")
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"unsafe path: {m.name}")
                  if m.issym() or m.islnk():
                      raise SystemExit(f"links forbidden in bootstrap: {m.name}")
                  if not (m.isdir() or m.isfile()):
                      raise SystemExit(f"unsupported member type: {m.name}")
                  name=m.name.rstrip("/")
                  if not name:
                      continue
                  if name in allowed_exact:
                      continue
                  if any(name.startswith(prefix) for prefix in allowed_prefixes):
                      continue
                  if any(exact.startswith(name + "/") for exact in allowed_exact):
                      continue
                  if any(prefix.startswith(name + "/") for prefix in allowed_prefixes):
                      continue
                  raise SystemExit(f"unexpected bundle path: {m.name}")
              tf.extractall(".", filter="data")
          PY
      - name: Verify Native implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q plugins/awesome-llm-apps-controller/tests
          bash plugins/awesome-llm-apps-controller/tests/test_sync_mirror.sh
          python - <<'PY'
          import json, tomllib
          json.load(open(".agents/plugins/marketplace.json", encoding="utf-8"))
          with open(".codex/config.toml","rb") as f:
              cfg=tomllib.load(f)
          assert cfg["features"]["multi_agent"] is True
          assert cfg["plugins"]["awesome-llm-apps-controller@whitechronos-repo"]["enabled"] is True
          print("CONFIG PASS")
          PY
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap/awesome
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- plugins/awesome-llm-apps-controller/
          git add -A -- registry/awesome-llm-apps/catalog.schema.json
          git add -A -- .bootstrap/awesome
          git status --short
          git commit -m "feat: implement Awesome LLM Apps Native integration"
          git push origin HEAD:feature/awesome-llm-apps-resumed

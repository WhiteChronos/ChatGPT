name: REA full product security evidence
on:
  pull_request:
    paths: ['systems/rea/**', '.agents/skills/rea-engenharia-reversa-evolutiva/**', '.github/workflows/rea-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r systems/rea/requirements-mcp.txt 'bandit==1.8.6'
      - name: Scan all REA runtime and operational Python code
        run: python -m bandit -ll -r systems/rea/src systems/rea/scripts systems/rea/skills
      - name: Security and protocol regression
        run: python -m pytest -q systems/rea/tests
      - name: Evidence boundary
        run: echo 'Full REA product Python scope and regression passed; external ECC review, host discovery and human acceptance remain separate gates.' >> "$GITHUB_STEP_SUMMARY"

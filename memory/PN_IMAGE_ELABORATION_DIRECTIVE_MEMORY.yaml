    date: "2026-09-29"
    event: IMAGE_ELABORATION_MASTER_DIRECTIVE_CREATED
    summary: "Criada diretriz mestre consolidando todo o entendimento aprovado para elaboracao de imagens PN e vinculada ao MODEL 001."

schema_version: "1.0"
system_id: AUT-PANEL-AGENT-SYSTEM-V1
standard_id: AUT-PAINEL-COMPACT-V2.4
status: CONTROLLED_ACTIVE
policy:
  fail_closed: true
  canonical_engineering_pipeline_unchanged: true
  generated_image_is_never_engineering_authority: true
  locked_contract_change_requires_explicit_user_authorization: true
  ml_is_advisory_only: true
  autoevolution_mode: PROPOSAL_ONLY
  human_gate_required_before_behavior_change: true
  per_panel_state_isolation: true
  append_only_memory_for_released_revisions: true
database:
  local_baseline: SQLite
  schema: database/aut_panel_schema.sql
  script: pipeline/aut_panel_db.py
  optional_targets: [PostgreSQL, Supabase_Postgres]
learning:
  pipeline: pipeline/learning_pipeline.yaml
  script: pipeline/aut_panel_learning.py
  evolution_script: pipeline/evolution_engine.py
  minimum_labeled_examples: 25
  cold_start_status: LEARNING_COLD_START
  registry: ml/model_registry.yaml
agents:
  - {id: ORCHESTRATOR, role: "Controlar ordem, gates, dependências e manifesto.", datacenter_namespace: agent_dc.orchestrator, memory_namespace: agent_memory.orchestrator, read_scope: [all_canonical_contracts, panel_state, qa_state], write_scope: [agent_runs, artifacts, stage_state]}
  - {id: TECHNICAL_RESEARCH, role: "Localizar fabricante, modelo, documentos, protocolos, fornecedores e alternativas.", datacenter_namespace: agent_dc.research, memory_namespace: agent_memory.research, read_scope: [project_inputs, manufacturer_sources, approved_internal_references, normative_registry], write_scope: [source_candidates, supplier_candidates, normative_candidates]}
  - {id: SOURCE_VALIDATOR_A, role: "Validar independentemente domínio, modelo, revisão, página, lifecycle, tensão, corrente e protocolo.", datacenter_namespace: agent_dc.source_validator_a, memory_namespace: agent_memory.source_validator_a, read_scope: [source_candidates, normative_registry], write_scope: [source_validations_a, normative_validations_a]}
  - {id: SOURCE_VALIDATOR_B, role: "Executar segunda validação independente.", datacenter_namespace: agent_dc.source_validator_b, memory_namespace: agent_memory.source_validator_b, read_scope: [source_candidates, normative_registry], write_scope: [source_validations_b, normative_validations_b]}
  - {id: DATACENTER_CURATOR, role: "Normalizar catálogo, referências, dimensões, ratings, lifecycle e fornecedores.", datacenter_namespace: agent_dc.datacenter_curator, memory_namespace: agent_memory.datacenter_curator, read_scope: [validated_sources_a, validated_sources_b, normative_registry], write_scope: [components, sources, suppliers, normative_applicability]}
  - {id: ELECTRICAL_SIZING, role: "Calcular cargas, fonte, UPS, baterias e proteções.", datacenter_namespace: agent_dc.electrical_sizing, memory_namespace: agent_memory.electrical_sizing, read_scope: [li, catalog, official_ratings, power_topology, applicable_norms], write_scope: [load_calculations, sizing_results]}
  - {id: AUTOMATION_IO, role: "Mapear CLP/UTR, I/O, rede, protocolos e intertravamentos.", datacenter_namespace: agent_dc.automation_io, memory_namespace: agent_memory.automation_io, read_scope: [project_drawings, io_lists, protocol_docs, applicable_norms], write_scope: [io_points, network_points, interlocks]}
  - {id: LI_BOM, role: "Congelar LI e gerar BOM com paridade estrita.", datacenter_namespace: agent_dc.li_bom, memory_namespace: agent_memory.li_bom, read_scope: [selected_components, quantity_registry, evidence], write_scope: [li_revisions, bom_lines]}
  - id: LAYOUT_OPTIMIZER
    role: "Posicionar componentes por restrições geométricas, térmicas e funcionais."
    datacenter_namespace: agent_dc.layout
    memory_namespace: agent_memory.layout
    read_scope: [bom, dimensions, enclosure_contract, clearance_rules, applicable_normative_constraints]
    write_scope: [layout_candidates, layout_metrics]
    implementation: pipeline/layout_optimizer/cli.py
    config: configs/layout_optimizer_v1.yaml
    result_schema: schemas/layout_optimizer_result_v1.schema.json
    solver: OR_TOOLS_CP_SAT
    dependency_graph: NetworkX
    decision_policy: USER_DECISION_REQUIRED_FOR_ENCLOSURE_OR_SPLIT
  - {id: RENDERER, role: "Gerar desenho vetorial canônico e imagens derivadas.", datacenter_namespace: agent_dc.renderer, memory_namespace: agent_memory.renderer, read_scope: [validated_layout, approved_visual_template], write_scope: [vector_artifacts, raster_artifacts, render_metrics]}
  - {id: QA, role: "Verificar geometria, paridade, evidência, workbook, imagem e regressão.", datacenter_namespace: agent_dc.qa, memory_namespace: agent_memory.qa, read_scope: [all_artifacts, all_contracts], write_scope: [qa_runs, qa_findings]}
  - {id: MEMORY_CURATOR, role: "Registrar decisões, revisões, HOLDs e eventos sem sobrescrever histórico.", datacenter_namespace: agent_dc.memory, memory_namespace: agent_memory.curator, read_scope: [approved_decisions, qa_runs, revision_events, normative_events], write_scope: [memory_events]}
  - {id: ML_QUALITY, role: "Aprender com histórico rotulado e estimar risco sem substituir gates determinísticos.", datacenter_namespace: agent_dc.ml_quality, memory_namespace: agent_memory.ml_quality, read_scope: [training_examples, qa_history, render_metrics], write_scope: [model_registry, model_metrics, risk_scores]}
  - {id: EVOLUTION_PROPOSER, role: "Criar propostas de melhoria com evidência, testes e rollback; nunca autoaplicar mudança bloqueada.", datacenter_namespace: agent_dc.evolution, memory_namespace: agent_memory.evolution, read_scope: [qa_history, model_metrics, repeated_failures, tool_registry], write_scope: [evolution_proposals]}
